<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏛️ Древнегреческий тренажёр (уроки 3–10)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #f7f2eb;
            color: #2c2c2c;
            padding: 16px;
            display: flex;
            justify-content: center;
        }
        .app {
            max-width: 950px;
            width: 100%;
            background: #fff;
            border-radius: 32px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
            padding: 24px 20px;
        }
        h1 {
            font-size: 28px;
            color: #3d2a1e;
            border-bottom: 2px solid #e5d9cf;
            padding-bottom: 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        h1 small {
            font-size: 28px;
            font-weight: 400;
            color: #3d2a1e;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 16px 0;
        }
        .menu-btn {
            background: #f0eae4;
            border: 0;
            border-radius: 8px;
            padding: 14px 12px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
            text-align: center;
        }
        .menu-btn:hover {
            background: #e0d5cb;
            transform: translateY(-2px);
        }
        .menu-btn.primary {
            background: #b7a48b;
            color: #fff;
        }
        .menu-btn.primary:hover {
            background: #9e8a73;
        }
        .menu-btn.danger {
            background: #d4b8b8;
            color: #4a2e2e;
        }
        .back-btn {
            background: 0;
            border: 0;
            color: #7a5f4b;
            font-size: 15px;
            cursor: pointer;
            margin-bottom: 14px;
        }
        .back-btn:hover {
            text-decoration: underline;
        }
        .section {
            display: none;
        }
        .section.active {
            display: block;
            animation: fade 0.25s ease;
        }
        @keyframes fade {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        .card {
            background: #fcf9f6;
            border-radius: 18px;
            padding: 20px 18px;
            margin-bottom: 18px;
            border: 1px solid #eee5dd;
        }
        .card h3 {
            margin-bottom: 10px;
            color: #4a3728;
            font-size: 18px;
        }
        .word-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .word-item {
            background: #ede7e0;
            border-radius: 8px;
            font-size: 15px;
            overflow: hidden;
        }
        .word-item .word-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 14px;
            cursor: pointer;
            user-select: none;
        }
        .word-item .word-row:hover {
            background: #e2d5c9;
        }
        .word-item .word-row strong {
            font-weight: 600;
            color: #3d2a1e;
        }
        .word-details {
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.3s ease, padding 0.3s ease, opacity 0.3s ease;
            padding: 0 14px;
            background: #f9f6f2;
            border-radius: 0 0 8px 8px;
            opacity: 0;
        }
        .word-details.open {
            max-height: 600px;
            padding: 8px 14px 12px;
            opacity: 1;
        }
        .word-details table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            margin: 0;
        }
        .word-details td, .word-details th {
            border: 1px solid #c9b9ab;
            padding: 4px 8px;
            text-align: center;
        }
        .word-details th {
            background: #ede7e0;
        }
        .grammar-text {
            font-size: 15px;
            line-height: 1.7;
            background: #f4eee8;
            padding: 16px 18px;
            border-radius: 14px;
            border-left: 4px solid #b7a48b;
        }
        .grammar-text table {
            border-collapse: collapse;
            margin: 10px 0;
            width: 100%;
            font-size: 14px;
        }
        .grammar-text td, .grammar-text th {
            border: 1px solid #c9b9ab;
            padding: 6px 10px;
            text-align: center;
        }
        .question {
            font-size: 19px;
            font-weight: 500;
            margin-bottom: 16px;
        }
        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 10px 0;
        }
        .option-btn {
            background: #f0eae4;
            border: 2px solid transparent;
            border-radius: 8px;
            padding: 10px 22px;
            font-size: 17px;
            cursor: pointer;
            transition: 0.1s;
            flex: 1;
            text-align: center;
        }
        .option-btn:hover {
            background: #e2d5c9;
            border-color: #b7a48b;
        }
        .option-btn.correct {
            background: #8fbc8f;
            color: #fff;
            border-color: #5f8b5f;
        }
        .option-btn.wrong {
            background: #d4a0a0;
            color: #fff;
            border-color: #b06a6a;
        }
        .feedback {
            padding: 14px 18px;
            border-radius: 14px;
            margin: 14px 0;
            font-weight: 500;
        }
        .feedback.ok {
            background: #e0f0e0;
            color: #1f5f2f;
        }
        .feedback.fail {
            background: #f0e0e0;
            color: #7a2e2e;
        }
        .input-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 10px 0;
        }
        .input-group input {
            flex: 1;
            padding: 10px 16px;
            border-radius: 8px;
            border: 2px solid #d9cec2;
            font-size: 17px;
            background: white;
            min-width: 180px;
        }
        .input-group button {
            padding: 10px 24px;
            border: 0;
            border-radius: 8px;
            background: #b7a48b;
            color: #fff;
            font-size: 17px;
            cursor: pointer;
        }
        .input-group button:hover {
            background: #9e8a73;
        }
        .word-bank {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 10px 0;
        }
        .word-bank .chip {
            background: #ede7e0;
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
            border: 2px solid transparent;
            user-select: none;
        }
        .word-bank .chip:hover {
            background: #d9cec2;
            transform: scale(1.02);
        }
        .word-bank .chip.picked {
            background: #b7a48b;
            color: #fff;
            opacity: 0.5;
            transform: scale(0.95);
            cursor: default;
        }
        .build-area {
            background: #f4eee8;
            padding: 10px 16px;
            border-radius: 8px;
            min-height: 44px;
            margin: 10px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            border: 2px dashed #c9b9ab;
        }
        .build-area .token {
            background: #b7a48b;
            color: #fff;
            padding: 4px 14px;
            border-radius: 8px;
            font-size: 17px;
        }
        .tab-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 12px 0;
        }
        .tab-bar button {
            flex: 1;
            min-width: 80px;
            padding: 10px 8px;
            border: 0;
            border-radius: 8px;
            background: #f0eae4;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        .tab-bar button.active {
            background: #b7a48b;
            color: #fff;
        }
        .tab-bar button:hover {
            background: #e0d5cb;
        }
        .flashcard-area {
            text-align: center;
            padding: 20px 0;
        }
        .flashcard-word {
            font-size: 40px;
            font-weight: 600;
            color: #3d2a1e;
            margin: 20px 0;
        }
        .flashcard-translation {
            font-size: 28px;
            color: #5f4a38;
            margin: 16px 0;
        }
        .flashcard-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .flashcard-buttons button {
            padding: 12px 32px;
            border: 0;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }
        .flashcard-buttons .show {
            background: #b7a48b;
            color: #fff;
        }
        .flashcard-buttons .know {
            background: #8fbc8f;
            color: #fff;
        }
        .flashcard-buttons .dontknow {
            background: #d4a0a0;
            color: #fff;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee5dd;
        }
        .stat-row:last-child {
            border-bottom: none;
        }
        .lesson-badge {
            background: #3d2a1e;
            color: #fff;
            padding: 2px 14px;
            border-radius: 8px;
            font-size: 14px;
            display: inline-block;
            margin-bottom: 10px;
        }
        .error-item {
            background: #fcf1f1;
            padding: 8px 14px;
            border-radius: 8px;
            margin: 4px 0;
            border-left: 4px solid #d4a0a0;
        }
        .clear-btn {
            background: none;
            border: 1px solid #d4a0a0;
            border-radius: 8px;
            padding: 6px 18px;
            color: #7a2e2e;
            cursor: pointer;
            font-size: 14px;
            margin-top: 8px;
        }
        .clear-btn:hover {
            background: #d4a0a0;
            color: #fff;
        }
        .vocab-section {
            margin-bottom: 16px;
        }
        .vocab-section h4 {
            background: #ede7e0;
            padding: 6px 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            color: #3d2a1e;
        }
        .vocab-section .word-item {
            margin-left: 8px;
        }
        @media (max-width: 600px) {
            .app { padding: 16px 12px; }
            .menu-grid { grid-template-columns: 1fr; }
            .options { flex-direction: column; }
            .option-btn { width: 100%; }
            .input-group input { min-width: 140px; }
            .tab-bar button { min-width: 60px; font-size: 13px; padding: 8px 6px; }
            .flashcard-word { font-size: 30px; }
            .flashcard-translation { font-size: 22px; }
        }
        .hidden { display: none !important; }
        .center { text-align: center; }
        .mt-12 { margin-top: 12px; }
        .mb-12 { margin-bottom: 12px; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .progress-text { font-size: 14px; color: #7a5f4b; }
        .decor-line { border: none; border-top: 2px solid #e5d9cf; margin: 20px 0; }
    </style>
</head>
<body>
<div class="app" id="app">

<h1>🏛️ Древнегреческий <small>тренажёр (уроки 3–10)</small></h1>

<!-- Главное меню -->
<div id="mainMenu" class="section active">
    <p style="margin-bottom:14px;color:#4a3728;">Выберите урок:</p>
    <div class="menu-grid" id="lessonGrid"></div>
    <hr class="decor-line">
    <div class="menu-grid" style="grid-template-columns:1fr 1fr 1fr;">
        <button class="menu-btn" onclick="showAllVocab()">📚 Словарь всех слов</button>
        <button class="menu-btn primary" onclick="startAllFlashcards()">📇 Проверка всех слов</button>
        <button class="menu-btn" onclick="showStats()">📊 Статистика</button>
        <button class="menu-btn" onclick="showErrors()">🔄 Ошибки</button>
        <button class="menu-btn danger" onclick="clearAllProgress()">🗑️ Сброс прогресса</button>
    </div>
</div>

<!-- Словарь всех слов -->
<div id="allVocabSection" class="section">
    <button class="back-btn" onclick="goToMain()">← Назад</button>
    <div class="card"><h3>📚 Словарь всех слов (уроки 3–10)</h3><div id="allVocabContent"></div></div>
</div>

<!-- Проверка всех слов (карточки) -->
<div id="allFlashcardsSection" class="section">
    <button class="back-btn" onclick="goToMain()">← Назад</button>
    <div class="card"><h3>📇 Проверка всех слов</h3><div id="allFlashcardContainer" class="flashcard-area"></div></div>
</div>

<!-- Урок -->
<div id="lessonSection" class="section">
    <button class="back-btn" onclick="goToMain()">← Назад</button>
    <h2 id="lessonTitle" style="margin-bottom:4px;"></h2>
    <div class="lesson-badge" id="lessonBadge">Урок 3</div>
    <div class="tab-bar">
        <button class="active" data-part="grammar" onclick="switchLessonPart('grammar')">📚 Грамматика</button>
        <button data-part="vocab" onclick="switchLessonPart('vocab')">📖 Словарь</button>
        <button data-part="exercise" onclick="switchLessonPart('exercise')">🔤 Упражнения</button>
        <button data-part="flashcards" onclick="switchLessonPart('flashcards')">📇 Карточки</button>
        <button data-part="test" onclick="startTest()">📝 Тест (10)</button>
        <button data-part="translation" onclick="switchLessonPart('translation')">🌍 Перевод</button>
    </div>
    <div id="partGrammar" class="section active"><div class="card"><h3>Грамматика</h3><div class="grammar-text" id="grammarContent"></div></div></div>
    <div id="partVocab" class="section"><div class="card"><h3>Словарь урока</h3><div class="word-list" id="vocabList"></div></div></div>
    <div id="partExercise" class="section"><div class="card"><h3>Упражнения</h3><div id="exerciseButtons"></div><div id="exerciseQuestion" style="margin-top:16px;"></div></div></div>
    <div id="partFlashcards" class="section"><div class="card"><h3>📇 Карточки</h3><div id="flashcardContainer" class="flashcard-area"><p>Нажмите «Начать карточки».</p><button class="menu-btn primary" onclick="startFlashcards()">▶️ Начать карточки</button></div></div></div>
    <div id="partTranslation" class="section"><div class="card"><h3>🌍 Перевод</h3><div id="translationButtons"></div><div id="translationQuestion" style="margin-top:16px;"></div></div></div>
</div>

<!-- Статистика -->
<div id="statsSection" class="section"><button class="back-btn" onclick="goToMain()">← Назад</button><div class="card"><h3>📊 Статистика</h3><div id="statsContent"></div></div></div>

<!-- Ошибки -->
<div id="errorsSection" class="section"><button class="back-btn" onclick="goToMain()">← Назад</button><div class="card"><h3>🔄 Ошибки</h3><div id="errorsContent"></div></div></div>

<!-- Тест -->
<div id="testSection" class="section"><button class="back-btn" onclick="cancelTest()">← Выйти</button><div class="card"><h3>📝 Тест</h3><div id="testContainer"></div></div></div>

</div>

<script>
// ============================================================
// ДАННЫЕ УРОКОВ 3–10 (ПОЛНЫЙ ВОКАБУЛЯР + ГРАММАТИКА + ПЕРЕВОДЫ)
// ============================================================

const LESSONS_DATA = {
    3: {
        title: "Глаголы на -ω (настоящее время)",
        grammar: `<b>Окончания глаголов в настоящем времени:</b><br>
        <table><tr><th>Лицо</th><th>Ед.ч.</th><th>Мн.ч.</th></tr>
        <tr><td>1-е</td><td>-ω</td><td>-ομεν</td></tr>
        <tr><td>2-е</td><td>-εις</td><td>-ετε</td></tr>
        <tr><td>3-е</td><td>-ει</td><td>-ουσι(ν)</td></tr></table><br>
        <b>Спряжение λύω:</b><br>
        <table><tr><th>Лицо</th><th>Ед.ч.</th><th>Мн.ч.</th></tr>
        <tr><td>1-е</td><td>λύω</td><td>λύομεν</td></tr>
        <tr><td>2-е</td><td>λύεις</td><td>λύετε</td></tr>
        <tr><td>3-е</td><td>λύει</td><td>λύουσι(ν)</td></tr></table>`,
        vocabulary: [
            {greek:"βλέπω", translation:"вижу", type:"verb", declension_forms:{singular:{"1":"βλέπω","2":"βλέπεις","3":"βλέπει"},plural:{"1":"βλέπομεν","2":"βλέπετε","3":"βλέπουσι(ν)"}}},
            {greek:"λαμβάνω", translation:"беру, получаю", type:"verb", declension_forms:{singular:{"1":"λαμβάνω","2":"λαμβάνεις","3":"λαμβάνει"},plural:{"1":"λαμβάνομεν","2":"λαμβάνετε","3":"λαμβάνουσι(ν)"}}},
            {greek:"γινώσκω", translation:"знаю", type:"verb", declension_forms:{singular:{"1":"γινώσκω","2":"γινώσκεις","3":"γινώσκει"},plural:{"1":"γινώσκομεν","2":"γινώσκετε","3":"γινώσκουσι(ν)"}}},
            {greek:"λέγω", translation:"говорю", type:"verb", declension_forms:{singular:{"1":"λέγω","2":"λέγεις","3":"λέγει"},plural:{"1":"λέγομεν","2":"λέγετε","3":"λέγουσι(ν)"}}},
            {greek:"γράφω", translation:"пишу", type:"verb", declension_forms:{singular:{"1":"γράφω","2":"γράφεις","3":"γράφει"},plural:{"1":"γράφομεν","2":"γράφετε","3":"γράφουσι(ν)"}}},
            {greek:"λύω", translation:"развязываю, освобождаю", type:"verb", declension_forms:{singular:{"1":"λύω","2":"λύεις","3":"λύει"},plural:{"1":"λύομεν","2":"λύετε","3":"λύουσι(ν)"}}},
            {greek:"διδάσκω", translation:"учу", type:"verb", declension_forms:{singular:{"1":"διδάσκω","2":"διδάσκεις","3":"διδάσκει"},plural:{"1":"διδάσκομεν","2":"διδάσκετε","3":"διδάσκουσι(ν)"}}},
            {greek:"ἔχω", translation:"имею", type:"verb", declension_forms:{singular:{"1":"ἔχω","2":"ἔχεις","3":"ἔχει"},plural:{"1":"ἔχομεν","2":"ἔχετε","3":"ἔχουσι(ν)"}}}
        ],
        exercises: {
            declension_fill: [
                {case:"1sg", correct:"λύω", distractors:["λύεις","λύει","λύομεν"]},
                {case:"2sg", correct:"λύεις", distractors:["λύω","λύει","λύετε"]},
                {case:"3sg", correct:"λύει", distractors:["λύω","λύεις","λύουσι"]},
                {case:"1pl", correct:"λύομεν", distractors:["λύω","λύετε","λύουσι"]},
                {case:"2pl", correct:"λύετε", distractors:["λύομεν","λύει","λύουσι"]},
                {case:"3pl", correct:"λύουσι(ν)", distractors:["λύομεν","λύετε","λύει"]}
            ],
            translate_greek_to_russian: [
                {greek:"βλέπω", keywords:["вижу"]},
                {greek:"γινώσκεις", keywords:["знаешь"]},
                {greek:"γράφει", keywords:["пишет"]},
                {greek:"διδάσκομεν", keywords:["учим"]},
                {greek:"ἔχετε", keywords:["имеете"]},
                {greek:"λαμβάνουσι", keywords:["берут"]},
                {greek:"λέγομεν", keywords:["говорим"]},
                {greek:"λύει", keywords:["развязывает"]}
            ],
            translate_russian_to_greek: [
                {russian:"я вижу", correct_sequence:["βλέπω"], all_words:["βλέπω","γινώσκω","γράφω"]},
                {russian:"ты знаешь", correct_sequence:["γινώσκεις"], all_words:["γινώσκεις","γράφεις","βλέπεις"]},
                {russian:"он пишет", correct_sequence:["γράφει"], all_words:["γράφει","λέγει","λύει"]}
            ],
            case_number: [
                {form:"λύεις", correct:"2-е л. ед.ч.", distractors:["1-е л. ед.ч.","3-е л. ед.ч.","2-е л. мн.ч."]},
                {form:"λύομεν", correct:"1-е л. мн.ч.", distractors:["1-е л. ед.ч.","2-е л. мн.ч.","3-е л. мн.ч."]}
            ]
        },
        translation: {
            ru_to_el: [
                {source:"мы знаем", correct:["γινώσκομεν"]},
                {source:"мы видим", correct:["βλέπομεν"]},
                {source:"они развязывают", correct:["λύουσι(ν)"]},
                {source:"он развязывает", correct:["λύει"]},
                {source:"вы имеете", correct:["ἔχετε"]},
                {source:"ты знаешь", correct:["γινώσκεις"]},
                {source:"я беру", correct:["λαμβάνω"]},
                {source:"они говорят", correct:["λέγουσι(ν)"]},
                {source:"он имеет", correct:["ἔχει"]},
                {source:"мы пишем", correct:["γράφομεν"]},
                {source:"они видят", correct:["βλέπουσι(ν)"]}
            ],
            el_to_ru: [
                {source:"βλέπεις", correct:["видишь"]},
                {source:"γινώσκετε", correct:["знаете"]},
                {source:"λέγετε", correct:["говорите"]},
                {source:"γράφει", correct:["пишет"]},
                {source:"βλέπομεν", correct:["видим"]},
                {source:"λαμβάνουσι(ν)", correct:["берут"]},
                {source:"βλέπει", correct:["видит"]},
                {source:"ἔχει", correct:["имеет"]}
            ]
        }
    },
    4: {
        title: "2-е склонение (мужской и средний род)",
        grammar: `<b>Склонение ἄνθρωπος (человек):</b><br>
        <table><tr><th>Падеж</th><th>Ед.ч.</th><th>Мн.ч.</th></tr>
        <tr><td>Nom.</td><td>ἄνθρωπος</td><td>ἄνθρωποι</td></tr>

function shuffle(a) {
    let c = a.slice();
    for (let i = c.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [c[i], c[j]] = [c[j], c[i]];
    }
    return c;
}

function getLessonData(l) { return LESSONS_DATA[l]; }

function getExercises(l, t) {
    let d = getLessonData(l);
    if (!d) return [];
    return d.exercises[t] || [];
}

function loadStats() {
    try {
        let d = localStorage.getItem('greek_stats');
        if (d) {
            let p = JSON.parse(d);
            stats.totalCorrect = p.totalCorrect || 0;
            stats.totalWrong = p.totalWrong || 0;
            stats.errors = p.errors || {};
        }
    } catch(e) {}
}
function saveStats() { localStorage.setItem('greek_stats', JSON.stringify(stats)); }

function showSection(id) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    let t = document.getElementById(id);
    if (t) t.classList.add('active');
}

function goToMain() { showSection('mainMenu'); renderMainMenu(); }

function renderMainMenu() {
    let grid = document.getElementById('lessonGrid');
    if (!grid) return;
    grid.innerHTML = '';
    for (let l = 3; l <= 10; l++) {
        let data = getLessonData(l);
        if (!data) continue;
        let btn = document.createElement('button');
        btn.className = 'menu-btn';
        btn.textContent = '📖 Урок ' + l + ': ' + data.title;
        btn.onclick = (function(lesson) { return function() { openLesson(lesson); }; })(l);
        grid.appendChild(btn);
    }
}

function showAllVocab() {
    showSection('allVocabSection');
    var container = document.getElementById('allVocabContent');
    // Собираем все слова
    var nouns = [], verbs = [], adjectives = [], prepositions = [], pronouns = [], adverbs = [], conjunctions = [], others = [];
    for (var l = 3; l <= 10; l++) {
        var data = getLessonData(l);
        if (!data || !data.vocabulary) continue;
        for (var i = 0; i < data.vocabulary.length; i++) {
            var item = data.vocabulary[i];
            var type = item.type || 'other';
            var entry = {
                greek: item.greek,
                article: item.article || '',
                translation: item.translation
            };
            switch (type) {
                case 'noun': nouns.push(entry); break;
                case 'verb': verbs.push(entry); break;
                case 'adjective': adjectives.push(entry); break;
                case 'preposition': prepositions.push(entry); break;
                case 'pronoun': pronouns.push(entry); break;
                case 'adverb': adverbs.push(entry); break;
                case 'conjunction': conjunctions.push(entry); break;
                default: others.push(entry);
            }
        }
    }
    // Убираем дубликаты (по греческому слову)
    function unique(arr) {
        var seen = {};
        return arr.filter(function(item) {
            var key = item.greek + '|' + item.article;
            if (seen[key]) return false;
            seen[key] = true;
            return true;
        });
    }
    nouns = unique(nouns);
    verbs = unique(verbs);
    adjectives = unique(adjectives);
    prepositions = unique(prepositions);
    pronouns = unique(pronouns);
    adverbs = unique(adverbs);
    conjunctions = unique(conjunctions);
    others = unique(others);

    function sortByGreek(a, b) { return a.greek.localeCompare(b.greek); }
    nouns.sort(sortByGreek);
    verbs.sort(sortByGreek);
    adjectives.sort(sortByGreek);
    prepositions.sort(sortByGreek);
    pronouns.sort(sortByGreek);
    adverbs.sort(sortByGreek);
    conjunctions.sort(sortByGreek);

    var html = '';
    if (nouns.length) {

        }
        html += '</div>';
    }
    if (verbs.length) {

            html += '<div class="word-item"><div class="word-row"><strong>' + verbs[i].greek + '</strong><span>' + verbs[i].translation + '</span></div></div>';
        }
        html += '</div>';
    }
    if (adjectives.length) {

        }
        html += '</div>';

        for (var i = 0; i < prepositions.length; i++) {
            html += '<div class="word-item"><div class="word-row"><strong>' + prepositions[i].greek + '</strong><span>' + prepositions[i].translation + '</span></div></div>';
        }
        html += '</div>';
    }
    if (pronouns.length) {

        for (var i = 0; i < pronouns.length; i++) {
            html += '<div class="word-item"><div class="word-row"><strong>' + pronouns[i].greek + '</strong><span>' + pronouns[i].translation + '</span></div></div>';
        }
        html += '</div>';
    }
    if (adverbs.length) {

            html += '<div class="word-item"><div class="word-row"><strong>' + adverbs[i].greek + '</strong><span>' + adverbs[i].translation + '</span></div></div>';

    if (conjunctions.length) {

function startAllFlashcards() {
    showSection('allFlashcardsSection');
    var container = document.getElementById('allFlashcardContainer');
    var allWords = [];
    for (var l = 3; l <= 10; l++) {
        var data = getLessonData(l);
        if (!data || !data.vocabulary) continue;
        for (var i = 0; i < data.vocabulary.length; i++) {
            var item = data.vocabulary[i];
            allWords.push({
                greek: item.greek,
                article: item.article || '',
                translation: item.translation,
                lesson: l
            });
        }
    }
    if (allWords.length === 0) {
        container.innerHTML = '<p>Нет слов.</p>';
        return;
    }
    var shuffled = shuffle(allWords);
    allFlashcardState = {
        words: shuffled,
        index: 0,
        revealed: false,
        correct: 0,
        total: shuffled.length
    };
    showAllFlashcard();
}

function showAllFlashcard() {
    var s = allFlashcardState;
    var container = document.getElementById('allFlashcardContainer');
    if (s.index >= s.total) {
        var p = Math.round((s.correct / s.total) * 100);
        container.innerHTML = '<div class="feedback ' + (p >= 70 ? 'ok' : 'fail') + '">🏁 Проверка завершена!<br>Знаю: ' + s.correct + ' из ' + s.total + ' (' + p + '%)</div><button class="menu-btn primary" onclick="startAllFlashcards()">🔄 Повторить</button><button class="menu-btn" onclick="goToMain()">🔙 В главное</button>';
        return;
    }
    var w = s.words[s.index];
    var html = '<div style="margin-bottom:8px;font-size:14px;color:#7a5f4b;">Слово ' + (s.index + 1) + ' из ' + s.total + '</div>';
    html += '<div class="flashcard-word">' + (w.article ? w.article + ' ' : '') + w.greek + '</div>';
    if (s.revealed) {
        html += '<div class="flashcard-translation">' + w.translation + '</div><div class="flashcard-buttons"><button class="know" onclick="allFlashcardAnswer(true)">✅ Знаю</button><button class="dontknow" onclick="allFlashcardAnswer(false)">❌ Не знаю</button></div>';
    } else {
        html += '<div class="flashcard-buttons"><button class="show" onclick="allFlashcardReveal()">👁️ Показать перевод</button></div>';
    }
    container.innerHTML = html;
}

function allFlashcardReveal() {
    allFlashcardState.revealed = true;
    showAllFlashcard();
}

function allFlashcardAnswer(know) {
    var s = allFlashcardState;
    if (know) {
        s.correct++;
        stats.totalCorrect++;
    } else {
        stats.totalWrong++;
        var w = s.words[s.index];
        if (!stats.errors['all']) stats.errors['all'] = [];
        stats.errors['all'].push({ word: w.greek, correct: w.translation, your: 'не знал' });
    }
    saveStats();
    s.index++;
    s.revealed = false;
    showAllFlashcard();
}

function openLesson(lesson) {
    currentLesson = lesson;
    let data = getLessonData(lesson);
    if (!data) return;
    document.getElementById('lessonTitle').textContent = data.title;
    document.getElementById('lessonBadge').textContent = 'Урок ' + lesson;
    showSection('lessonSection');

    document.querySelectorAll('.tab-bar button').forEach(b => b.classList.remove('active'));
    document.querySelector('.tab-bar button[data-part="grammar"]').classList.add('active');

    document.getElementById('grammarContent').innerHTML = data.grammar || '';

    let container = document.getElementById('vocabList');
    container.innerHTML = '';
    if (data.vocabulary) {
        data.vocabulary.forEach(item => {
            let article = item.article ? item.article + ' ' : '';
            let div = document.createElement('div');
            div.className = 'word-item';
            if (item.declension_forms) {
                div.classList.add('clickable');
                div.onclick = function(el) { return function() { toggleDeclension(el); }; }(div);
            }
            let detailsHtml = '';
            if (item.declension_forms) {
                detailsHtml = '<div class="word-details">' + generateDeclensionTable(item.declension_forms) + '</div>';
            }
            div.innerHTML = '<div class="word-row"><strong>' + article + item.greek + '</strong><span>' + item.translation + '</span></div>' + detailsHtml;
            container.appendChild(div);
        });
    }

    // Упражнения
    let btnContainer = document.getElementById('exerciseButtons');
    btnContainer.innerHTML = '';
    let hasExercises = false;
    if (data.exercises) {
        let keys = Object.keys(data.exercises);
        for (let k of keys) {
            if (data.exercises[k] && data.exercises[k].length > 0) { hasExercises = true; break; }
        }
    }
    if (hasExercises) {
        let types = [
            { key: 'declension_fill', label: '📐 Склонение' },
            { key: 'translate_greek_to_russian', label: '🇬🇷→🇷🇺 Перевод' },
            { key: 'translate_russian_to_greek', label: '🇷🇺→🇬🇷 Перевод' },
            { key: 'case_number', label: '🎯 Падеж/число' },
            { key: 'agreement', label: '🔗 Согласование' },
            { key: 'attribute_vs_predicate', label: '⚖️ Атрибут/предикатив' },
            { key: 'substantivation', label: '📌 Субстантивация' },
            { key: 'article_fill', label: '🔤 Артикль' }
        ];
        types.forEach(t => {
            if (data.exercises[t.key] && data.exercises[t.key].length > 0) {
                let b = document.createElement('button');
                b.className = 'menu-btn';
                b.textContent = t.label;
                b.onclick = (function(type) { return function() { startExercise(type); }; })(t.key);
                btnContainer.appendChild(b);
            }
        });
        if (btnContainer.children.length === 0) btnContainer.innerHTML = '<p>Нет упражнений.</p>';
    } else {
        btnContainer.innerHTML = '<p>Упражнений нет.</p>';
    }
    document.getElementById('exerciseQuestion').innerHTML = '';

    // Карточки
    document.getElementById('flashcardContainer').innerHTML =
        '<p>Нажмите «Начать карточки».</p><button class="menu-btn primary" onclick="startFlashcards()">▶️ Начать карточки</button>';
    flashcardState = { words: [], index: 0, revealed: false, correct: 0, total: 0 };

    // Перевод
    let transContainer = document.getElementById('translationButtons');
    transContainer.innerHTML = '';
    if (data.translation) {
        let hasRu = data.translation.ru_to_el && data.translation.ru_to_el.length > 0;
        let hasEl = data.translation.el_to_ru && data.translation.el_to_ru.length > 0;
        if (hasRu) {
            let b = document.createElement('button');
            b.className = 'menu-btn primary';
            b.textContent = '🇷🇺→🇬🇷';
            b.onclick = function() { startTranslation('ru_to_el'); };
            transContainer.appendChild(b);
        }
        if (hasEl) {
            let b = document.createElement('button');
            b.className = 'menu-btn primary';
            b.textContent = '🇬🇷→🇷🇺';
            b.onclick = function() { startTranslation('el_to_ru'); };
            transContainer.appendChild(b);
        }
        if (!hasRu && !hasEl) transContainer.innerHTML = '<p>Нет упражнений на перевод.</p>';
    } else {
        transContainer.innerHTML = '<p>Нет упражнений на перевод.</p>';
    }
    document.getElementById('translationQuestion').innerHTML = '';

    switchLessonPart('grammar');
}

function switchLessonPart(part) {
    document.querySelectorAll('.tab-bar button').forEach(b => b.classList.remove('active'));
    let activeTab = document.querySelector('.tab-bar button[data-part="' + part + '"]');
    if (activeTab) activeTab.classList.add('active');

    document.querySelectorAll('#lessonSection .section').forEach(s => s.classList.remove('active'));
    let target = document.getElementById('part' + part.charAt(0).toUpperCase() + part.slice(1));
    if (target) target.classList.add('active');

    if (part === 'flashcards' && flashcardState.words.length === 0) startFlashcards();
    if (part === 'translation') {
        let data = getLessonData(currentLesson);
        if (data.translation) {
            let hasRu = data.translation.ru_to_el && data.translation.ru_to_el.length > 0;
            let hasEl = data.translation.el_to_ru && data.translation.el_to_ru.length > 0;
            let container = document.getElementById('translationButtons');
            if (container.innerHTML.trim() === '') {
                if (hasRu) {
                    let b = document.createElement('button');
                    b.className = 'menu-btn primary';
                    b.textContent = '🇷🇺→🇬🇷';
                    b.onclick = function() { startTranslation('ru_to_el'); };
                    container.appendChild(b);
                }
                if (hasEl) {
                    let b = document.createElement('button');
                    b.className = 'menu-btn primary';
                    b.textContent = '🇬🇷→🇷🇺';
                    b.onclick = function() { startTranslation('el_to_ru'); };
                    container.appendChild(b);
                }
                if (!hasRu && !hasEl) container.innerHTML = '<p>Нет упражнений на перевод.</p>';
            }
        }
    }
}

// ============================================================
// ФУНКЦИИ ДЛЯ АККОРДЕОНА (таблицы склонений)
// ============================================================
function generateDeclensionTable(forms) {
    if (!forms) return '';
    let html = '';
    if (forms.masculine || forms.feminine || forms.neuter) {
        let cases = ['nom','gen','dat','acc','voc'];
        let labels = {nom:'Nom.',gen:'Gen.',dat:'Dat.',acc:'Acc.',voc:'Voc.'};
        html += '<table><thead><tr><th>Падеж</th><th>Муж.</th><th>Жен.</th><th>Ср.</th></tr></thead><tbody>';
        for (let c of cases) {
            let m = (forms.masculine && forms.masculine.singular && forms.masculine.singular[c]) ? forms.masculine.singular[c] : '';
            let f = (forms.feminine && forms.feminine.singular && forms.feminine.singular[c]) ? forms.feminine.singular[c] : '';
            let n = (forms.neuter && forms.neuter.singular && forms.neuter.singular[c]) ? forms.neuter.singular[c] : '';
            html += '<tr><td>'+labels[c]+'</td><td>'+m+'</td><td>'+f+'</td><td>'+n+'</td></tr>';
        }
        html += '</tbody></table>';
        let hasPlural = (forms.masculine && forms.masculine.plural) || (forms.feminine && forms.feminine.plural) || (forms.neuter && forms.neuter.plural);
        if (hasPlural) {
            html += '<table><thead><tr><th>Падеж</th><th>Муж. (мн.)</th><th>Жен. (мн.)</th><th>Ср. (мн.)</th></tr></thead><tbody>';
            for (let c of cases) {
                let m = (forms.masculine && forms.masculine.plural && forms.masculine.plural[c]) ? forms.masculine.plural[c] : '';
                let f = (forms.feminine && forms.feminine.plural && forms.feminine.plural[c]) ? forms.feminine.plural[c] : '';
                let n = (forms.neuter && forms.neuter.plural && forms.neuter.plural[c]) ? forms.neuter.plural[c] : '';
                html += '<tr><td>'+labels[c]+'</td><td>'+m+'</td><td>'+f+'</td><td>'+n+'</td></tr>';
            }
            html += '</tbody></table>';
        }
        return html;
    }
    if (forms.singular || forms.plural) {
        let cases = ['nom','gen','dat','acc','voc'];
        let labels = {nom:'Nom.',gen:'Gen.',dat:'Dat.',acc:'Acc.',voc:'Voc.'};
        if (forms.singular && forms.singular.nom !== undefined) {
            html += '<table><thead><tr><th>Падеж</th><th>Ед.ч.</th><th>Мн.ч.</th></tr></thead><tbody>';
            for (let c of cases) {
                let sg = (forms.singular && forms.singular[c]) ? forms.singular[c] : '';
                let pl = (forms.plural && forms.plural[c]) ? forms.plural[c] : '';
                html += '<tr><td>'+labels[c]+'</td><td>'+sg+'</td><td>'+pl+'</td></tr>';
            }
            html += '</tbody></table>';
        } else if (forms.singular && forms.singular["1"] !== undefined) {
            let persons = ['1','2','3'];
            let personLabels = ['1-е лицо','2-е лицо','3-е лицо'];
            html += '<table><thead><tr><th>Лицо</th><th>Ед.ч.</th><th>Мн.ч.</th></tr></thead><tbody>';
            for (let i=0; i<persons.length; i++) {
                let sg = (forms.singular && forms.singular[persons[i]]) ? forms.singular[persons[i]] : '';
                let pl = (forms.plural && forms.plural[persons[i]]) ? forms.plural[persons[i]] : '';
                html += '<tr><td>'+personLabels[i]+'</td><td>'+sg+'</td><td>'+pl+'</td></tr>';
            }
            html += '</tbody></table>';
        } else {
            let keys = Object.keys(forms.singular || {});
            for (let k of keys) {
                let sg = forms.singular ? forms.singular[k] : '';
                let pl = forms.plural ? forms.plural[k] : '';
                html += '<tr><td>'+k+'</td><td>'+sg+'</td><td>'+pl+'</td></tr>';
            }
        }
        return html;
    }
    return '';
}

function toggleDeclension(el) {
    let details = el.querySelector('.word-details');
    if (details) details.classList.toggle('open');
}

// ============================================================
// УПРАЖНЕНИЯ (основные функции)
// ============================================================
function startExercise(type) {
    let questions = getExercises(currentLesson, type);
    if (!questions || questions.length === 0) {
        document.getElementById('exerciseQuestion').innerHTML = '<p>Нет вопросов.</p>';
        return;
    }
    exerciseState = { type: type, questions: shuffle(questions), index: 0, correct: 0, total: questions.length };
    showExercise();
}

function getCaseName(caseKey) {
    let map = {
        '1sg':'1-е лицо ед.ч.','2sg':'2-е лицо ед.ч.','3sg':'3-е лицо ед.ч.',
        '1pl':'1-е лицо мн.ч.','2pl':'2-е лицо мн.ч.','3pl':'3-е лицо мн.ч.',
        'gen_sg':'Genitivus (Род. п.)','dat_sg':'Dativus (Дат. п.)','acc_sg':'Accusativus (Вин. п.)',
        'nom_pl':'Nominativus (Им. п.) мн.ч.','gen_pl':'Genitivus (Род. п.) мн.ч.','dat_pl':'Dativus (Дат. п.) мн.ч.','acc_pl':'Accusativus (Вин. п.) мн.ч.',
        'gen_sg_m':'Genitivus (Род. п.) муж.р.','dat_sg_f':'Dativus (Дат. п.) жен.р.','acc_sg_n':'Accusativus (Вин. п.) ср.р.'
    };
    return map[caseKey] || caseKey;
}

function showExercise() {
    let s = exerciseState;
    if (s.index >= s.total) {
        let p = Math.round((s.correct / s.total) * 100);
        document.getElementById('exerciseQuestion').innerHTML =
            '<div class="feedback ' + (p >= 70 ? 'ok' : 'fail') + '">🏁 Упражнение завершено!<br>Правильно: ' + s.correct + ' из ' + s.total + ' (' + p + '%)</div>' +
            '<button class="menu-btn primary" onclick="startExercise(\'' + s.type + '\')">🔄 Ещё раз</button>';
        return;
    }
    let q = s.questions[s.index];
    let container = document.getElementById('exerciseQuestion');
    let html = '<div style="margin-bottom:8px;font-size:14px;color:#7a5f4b;">Урок ' + currentLesson + ', упражнение ' + (s.index + 1) + ' из ' + s.total + '</div>';

    if (s.type === 'declension_fill') {
        let caseName = getCaseName(q.case);
        let wordDisplay = q.word ? q.word + ' (' + q.translation + ')' : '';
        html += '<div class="question">Вставьте форму для <b>' + caseName + '</b> для слова <b>' + wordDisplay + '</b></div><div class="options">';
        let opts = shuffle([q.correct].concat(q.distractors));
        for (let o of opts) html += '<button class="option-btn" onclick="answerOpt(\'' + o + '\',\'' + q.correct + '\')">' + o + '</button>';
        html += '</div>';
    } else if (s.type === 'translate_greek_to_russian') {
        html += '<div class="question">Переведите на русский:</div><div style="font-size:24px;text-align:center;margin:12px 0;">' + q.greek + '</div><div class="input-group"><input type="text" id="transInput" placeholder="Введите перевод..."><button onclick="checkTranslation()">✅ Проверить</button></div>';
        window._trans_q = q;
    } else if (s.type === 'translate_russian_to_greek') {
        let words = shuffle(q.all_words);
        html += '<div class="question">Переведите на греческий (выберите слова по порядку):</div><div style="font-size:20px;text-align:center;margin:12px 0;">' + q.russian + '</div><div class="build-area" id="buildArea"></div><div class="word-bank" id="wordBank">';
        for (let w of words) html += '<span class="chip" onclick="pickWord(\'' + w + '\')">' + w + '</span>';
        html += '</div><button class="menu-btn primary" onclick="checkTranslationRu()">✅ Готово</button> <button class="menu-btn" onclick="clearChosen()">↩️ Очистить</button>';
        window._trans_ru = q;
        window._chosen = [];
    } else if (s.type === 'case_number') {
        html += '<div class="question">Определите падеж и число для формы: <b>' + q.form + '</b></div><div class="options">';
        let opts = shuffle([q.correct].concat(q.distractors));
        for (let o of opts) html += '<button class="option-btn" onclick="answerOpt(\'' + o + '\',\'' + q.correct + '\')">' + o + '</button>';
        html += '</div>';
    } else if (s.type === 'agreement') {
        html += '<div class="question">Вставьте прилагательное <b>' + q.adjective + '</b> в правильной форме:<br>' + q.article + ' ____ ' + q.noun + '</div><div class="options">';
        let opts = shuffle([q.correct].concat(q.distractors));
        for (let o of opts) html += '<button class="option-btn" onclick="answerOpt(\'' + o + '\',\'' + q.correct + '\')">' + o + '</button>';
        html += '</div>';
    } else if (s.type === 'attribute_vs_predicate') {
        html += '<div class="question">Определите, атрибутив или предикатив:<br><b>' + q.phrase + '</b></div><div class="options">';
        let opts = shuffle([q.correct].concat(q.distractors));
        for (let o of opts) html += '<button class="option-btn" onclick="answerOpt(\'' + o + '\',\'' + q.correct + '\')">' + o + '</button>';
        html += '</div>';
    } else if (s.type === 'substantivation') {
        html += '<div class="question">Что означает:<br><b>' + q.phrase + '</b> ?</div><div class="options">';
        let opts = shuffle([q.correct].concat(q.distractors));
        for (let o of opts) html += '<button class="option-btn" onclick="answerOpt(\'' + o + '\',\'' + q.correct + '\')">' + o + '</button>';
        html += '</div>';
    } else if (s.type === 'article_fill') {
        html += '<div class="question">Вставьте правильную форму артикля:<br>____ ' + q.noun + '</div><div class="options">';
        let opts = shuffle([q.correct_article].concat(q.distractors));
        for (let o of opts) html += '<button class="option-btn" onclick="answerOpt(\'' + o + '\',\'' + q.correct_article + '\')">' + o + '</button>';
        html += '</div>';
    } else {
        html += '<p>Тип упражнения не поддерживается.</p>';
    }
    container.innerHTML = html;
}

function answerOpt(sel, corr) {
    let container = document.getElementById('exerciseQuestion');
    let btns = container.querySelectorAll('.option-btn');
    let ok = sel === corr;
    btns.forEach(b => { b.disabled = true; if (b.textContent === corr) b.classList.add('correct'); if (b.textContent === sel && !ok) b.classList.add('wrong'); });
    if (ok) { stats.totalCorrect++; exerciseState.correct++; } else {
        stats.totalWrong++;
        let lesson = currentLesson;
        if (!stats.errors[lesson]) stats.errors[lesson] = [];
        let q = exerciseState.questions[exerciseState.index];
        stats.errors[lesson].push({ word: q.word || q.greek || 'вопрос', correct: corr, your: sel });
    }
    saveStats();
    exerciseState.index++;
    setTimeout(showExercise, 1200);
}

function checkTranslation() {
    let inp = document.getElementById('transInput');
    if (!inp) return;
    let ans = inp.value.trim().toLowerCase();
    let q = window._trans_q;
    if (!q) return;
    let ok = true;
    for (let kw of q.keywords) {
        if (ans.indexOf(kw.toLowerCase()) === -1) { ok = false; break; }
    }
    let container = document.getElementById('exerciseQuestion');
    if (ok) { stats.totalCorrect++; exerciseState.correct++; container.innerHTML = '<div class="feedback ok">✅ Верно!</div>'; } else {
        stats.totalWrong++;
        let lesson = currentLesson;
        if (!stats.errors[lesson]) stats.errors[lesson] = [];
        stats.errors[lesson].push({ word: q.greek, correct: q.keywords.join(', '), your: ans });
        container.innerHTML = '<div class="feedback fail">❌ Неверно. Ключевые слова: ' + q.keywords.join(', ') + '</div>';
    }
    saveStats();
    exerciseState.index++;
    setTimeout(showExercise, 1500);
}

function pickWord(w) {
    window._chosen.push(w);
    let bank = document.getElementById('wordBank');
    bank.querySelectorAll('.chip').forEach(c => {
        if (c.textContent === w && !c.classList.contains('picked')) c.classList.add('picked');
    });
    let area = document.getElementById('buildArea');
    let t = document.createElement('span');
    t.className = 'token';
    t.textContent = w;
    area.appendChild(t);
}

function clearChosen() {
    window._chosen = [];
    document.getElementById('buildArea').innerHTML = '';
    document.getElementById('wordBank').querySelectorAll('.chip').forEach(c => c.classList.remove('picked'));
}

function checkTranslationRu() {
    let chosen = window._chosen || [];
    let q = window._trans_ru;
    if (!q) return;
    let corr = q.correct_sequence;
    let ok = chosen.length === corr.length && chosen.every((w,i) => w === corr[i]);
    let container = document.getElementById('exerciseQuestion');
    if (ok) { stats.totalCorrect++; exerciseState.correct++; container.innerHTML = '<div class="feedback ok">✅ Верно!</div>'; } else {
        stats.totalWrong++;
        let lesson = currentLesson;
        if (!stats.errors[lesson]) stats.errors[lesson] = [];
        stats.errors[lesson].push({ word: q.russian, correct: corr.join(' '), your: chosen.join(' ') });
        container.innerHTML = '<div class="feedback fail">❌ Неверно. Правильно: ' + corr.join(' ') + '</div>';
    }
    saveStats();
    exerciseState.index++;
    setTimeout(showExercise, 1500);
}

// ============================================================
// КАРТОЧКИ (урока)
// ============================================================
function startFlashcards() {
    let data = getLessonData(currentLesson);
    if (!data || !data.vocabulary || data.vocabulary.length === 0) {
        document.getElementById('flashcardContainer').innerHTML = '<p>Нет слов.</p>';
        return;
    }
    let words = shuffle(data.vocabulary.map(item => {
        return { greek: item.greek, article: item.article || '', translation: item.translation };
    }));
    flashcardState = { words: words, index: 0, revealed: false, correct: 0, total: words.length };
    showFlashcard();
}

function showFlashcard() {
    let s = flashcardState;
    let container = document.getElementById('flashcardContainer');
    if (s.index >= s.total) {
        let p = Math.round((s.correct / s.total) * 100);
        container.innerHTML = '<div style="margin-bottom:8px;font-size:14px;color:#7a5f4b;">Урок ' + currentLesson + '</div><div class="feedback ' + (p >= 70 ? 'ok' : 'fail') + '">🏁 Карточки завершены!<br>Знаю: ' + s.correct + ' из ' + s.total + ' (' + p + '%)</div><button class="menu-btn primary" onclick="startFlashcards()">🔄 Повторить</button>';
        return;
    }
    let w = s.words[s.index];
    let html = '<div style="margin-bottom:8px;font-size:14px;color:#7a5f4b;">Урок ' + currentLesson + ', карточка ' + (s.index + 1) + ' из ' + s.total + '</div>';
    html += '<div class="flashcard-word">' + (w.article ? w.article + ' ' : '') + w.greek + '</div>';
    if (s.revealed) {
        html += '<div class="flashcard-translation">' + w.translation + '</div><div class="flashcard-buttons"><button class="know" onclick="flashAnswer(true)">✅ Знаю</button><button class="dontknow" onclick="flashAnswer(false)">❌ Не знаю</button></div>';
    } else {
        html += '<div class="flashcard-buttons"><button class="show" onclick="flashReveal()">👁️ Показать перевод</button></div>';
    }
    container.innerHTML = html;
}

function flashReveal() { flashcardState.revealed = true; showFlashcard(); }

function flashAnswer(know) {
    let s = flashcardState;
    if (know) { s.correct++; stats.totalCorrect++; } else {
        stats.totalWrong++;
        let lesson = currentLesson;
        let w = s.words[s.index];
        if (!stats.errors[lesson]) stats.errors[lesson] = [];
        stats.errors[lesson].push({ word: w.greek, correct: w.translation, your: 'не знал' });
    }
    saveStats();
    s.index++;
    s.revealed = false;
    showFlashcard();
}

// ============================================================
// ТЕСТ
// ============================================================
function startTest() {
    let data = getLessonData(currentLesson);
    if (!data) return;
    let all = [];
    let types = ['declension_fill','translate_greek_to_russian','translate_russian_to_greek','case_number','agreement','attribute_vs_predicate','substantivation','article_fill'];
    for (let t of types) {
        let qs = data.exercises[t] || [];
        for (let q of qs) { q._type = t; all.push(q); }
    }
    if (all.length === 0) { alert('Нет вопросов.'); return; }
    testState = { questions: shuffle(all).slice(0, 10), index: 0, correct: 0, total: 10, answered: false };
    showSection('testSection');
    showTest();
}

function cancelTest() {
    testState = { questions: [], index: 0, correct: 0, total: 0, answered: false };
    showSection('lessonSection');
    switchLessonPart('exercise');
}

function showTest() {
    let s = testState;
    if (s.index >= s.total) {
        let p = Math.round((s.correct / s.total) * 100);
        document.getElementById('testContainer').innerHTML =
            '<div style="margin-bottom:8px;font-size:14px;color:#7a5f4b;">Урок ' + currentLesson + '</div><div class="feedback ' + (p >= 70 ? 'ok' : 'fail') + '">🏁 Тест завершён!<br>Правильно: ' + s.correct + ' из ' + s.total + ' (' + p + '%)</div><button class="menu-btn primary" onclick="startTest()">🔄 Повторить</button><button class="menu-btn" onclick="cancelTest()">🔙 Назад</button>';
        return;
    }
    let q = s.questions[s.index];
    let container = document.getElementById('testContainer');
    let html = '<div style="margin-bottom:8px;font-size:14px;color:#7a5f4b;">Урок ' + currentLesson + ', вопрос ' + (s.index + 1) + ' из ' + s.total + '</div>';
    let t = q._type;

    if (t === 'declension_fill' || t === 'case_number' || t === 'agreement' ||
        t === 'attribute_vs_predicate' || t === 'substantivation' || t === 'article_fill') {
        let text = '';
        if (t === 'declension_fill') {
            let caseName = getCaseName(q.case);
            let wordDisplay = q.word ? q.word + ' (' + q.translation + ')' : '';
            text = 'Вставьте форму для <b>' + caseName + '</b> для слова <b>' + wordDisplay + '</b>';
        } else if (t === 'case_number') {
            text = 'Определите падеж и число: <b>' + q.form + '</b>';
        } else if (t === 'agreement') {
            text = 'Вставьте прилагательное <b>' + q.adjective + '</b>: ' + q.article + ' ____ ' + q.noun;
        } else if (t === 'attribute_vs_predicate') {
            text = 'Атрибутив или предикатив? <b>' + q.phrase + '</b>';
        } else if (t === 'substantivation') {
            text = 'Что означает? <b>' + q.phrase + '</b>';
        } else if (t === 'article_fill') {
            text = 'Вставьте артикль: ____ ' + q.noun;
        }
        let corr = q.correct || q.correct_article;
        let opts = shuffle([corr].concat(q.distractors));
        html += '<div class="question">' + text + '</div><div class="options">';
        for (let o of opts) html += '<button class="option-btn" onclick="testAnswer(\'' + o + '\',\'' + corr + '\')">' + o + '</button>';
        html += '</div>';
    } else if (t === 'translate_greek_to_russian') {
        html += '<div class="question">Переведите: <b>' + q.greek + '</b></div><div class="input-group"><input type="text" id="testTransInput" placeholder="Введите перевод..."><button onclick="testTranslation()">✅ Проверить</button></div>';
        window._test_q = q;
    } else if (t === 'translate_russian_to_greek') {
        let words = shuffle(q.all_words);
        html += '<div class="question">Переведите на греческий (выберите слова по порядку):<br>' + q.russian + '</div>';
        html += '<div class="build-area" id="testBuildArea"></div><div class="word-bank" id="testWordBank">';
        for (let w of words) html += '<span class="chip" onclick="testPickWord(\'' + w + '\')">' + w + '</span>';
        html += '</div><button class="menu-btn primary" onclick="testTranslationRu()">✅ Готово</button> <button class="menu-btn" onclick="testClearChosen()">↩️ Очистить</button>';
        window._test_ru = q;
        window._test_chosen = [];
    } else {
        html += '<p>Неизвестный тип вопроса.</p>';
    }
    container.innerHTML = html;
    s.answered = false;
}

function testAnswer(sel, corr) {
    if (testState.answered) return;
    testState.answered = true;
    let ok = sel === corr;
    if (ok) testState.correct++;
    else {
        stats.totalWrong++;
        let lesson = currentLesson;
        if (!stats.errors[lesson]) stats.errors[lesson] = [];
        let q = testState.questions[testState.index];
        stats.errors[lesson].push({ word: q.word || q.greek || 'вопрос', correct: corr, your: sel });
    }
    stats.totalCorrect += ok ? 1 : 0;
    saveStats();
    let container = document.getElementById('testContainer');
    if (ok) container.innerHTML = '<div class="feedback ok">✅ Верно!</div>';
    else container.innerHTML = '<div class="feedback fail">❌ Неверно. Правильный ответ: <strong>' + corr + '</strong></div>';
    setTimeout(() => { testState.index++; showTest(); }, 1500);
}

function testTranslation() {
    if (testState.answered) return;
    let inp = document.getElementById('testTransInput');
    if (!inp) return;
    let ans = inp.value.trim().toLowerCase();
    let q = window._test_q;
    if (!q) return;
    let ok = true;
    for (let kw of q.keywords) {
        if (ans.indexOf(kw.toLowerCase()) === -1) { ok = false; break; }
    }
    let container = document.getElementById('testContainer');
    if (ok) { testState.correct++; stats.totalCorrect++; container.innerHTML = '<div class="feedback ok">✅ Верно!</div>'; } else {
        stats.totalWrong++;
        let lesson = currentLesson;
        if (!stats.errors[lesson]) stats.errors[lesson] = [];
        stats.errors[lesson].push({ word: q.greek, correct: q.keywords.join(', '), your: ans });
        container.innerHTML = '<div class="feedback fail">❌ Неверно. Ключевые слова: ' + q.keywords.join(', ') + '</div>';
    }
    saveStats();
    testState.answered = true;
    setTimeout(() => { testState.index++; showTest(); }, 1500);
}

function testPickWord(w) {
    if (testState.answered) return;
    window._test_chosen.push(w);
    let bank = document.getElementById('testWordBank');
    bank.querySelectorAll('.chip').forEach(c => {
        if (c.textContent === w && !c.classList.contains('picked')) c.classList.add('picked');
    });
    let area = document.getElementById('testBuildArea');
    let t = document.createElement('span');
    t.className = 'token';
    t.textContent = w;
    area.appendChild(t);
}

function testClearChosen() {
    window._test_chosen = [];
    document.getElementById('testBuildArea').innerHTML = '';
    document.getElementById('testWordBank').querySelectorAll('.chip').forEach(c => c.classList.remove('picked'));
}

function testTranslationRu() {
    if (testState.answered) return;
    let chosen = window._test_chosen || [];
    let q = window._test_ru;
    if (!q) return;
    let corr = q.correct_sequence;
    let ok = chosen.length === corr.length && chosen.every((w,i) => w === corr[i]);
    let container = document.getElementById('testContainer');
    if (ok) { testState.correct++; stats.totalCorrect++; container.innerHTML = '<div class="feedback ok">✅ Верно!</div>'; } else {
        stats.totalWrong++;
        let lesson = currentLesson;
        if (!stats.errors[lesson]) stats.errors[lesson] = [];
        stats.errors[lesson].push({ word: q.russian, correct: corr.join(' '), your: chosen.join(' ') });
        container.innerHTML = '<div class="feedback fail">❌ Неверно. Правильно: ' + corr.join(' ') + '</div>';
    }
    saveStats();
    testState.answered = true;
    setTimeout(() => { testState.index++; showTest(); }, 1500);
}

// ============================================================
// СТАТИСТИКА И ОШИБКИ
// ============================================================
function showStats() {
    showSection('statsSection');
    document.getElementById('statsContent').innerHTML =
        '<div class="stat-row"><span>✅ Правильных:</span><span>' + stats.totalCorrect + '</span></div>' +
        '<div class="stat-row"><span>❌ Неправильных:</span><span>' + stats.totalWrong + '</span></div>' +
        '<div class="stat-row"><span>📚 Уроков с ошибками:</span><span>' + Object.keys(stats.errors).length + '</span></div>';
}

function showErrors() {
    showSection('errorsSection');
    let content = document.getElementById('errorsContent');
    let err = stats.errors;
    if (!err || Object.keys(err).length === 0) { content.innerHTML = '<p>🎉 Ошибок нет!</p>'; return; }
    let html = '';
    for (let lesson of Object.keys(err)) {
        let items = err[lesson];
        html += '<div style="margin-bottom:12px;"><strong>Урок ' + lesson + '</strong></div>';
        for (let e of items) {
            html += '<div class="error-item">' + e.word + ' → правильно: <strong>' + e.correct + '</strong>, вы: ' + e.your + '</div>';
        }
    }
    html += '<button class="clear-btn" onclick="clearErrors()">🗑️ Очистить ошибки</button>';
    content.innerHTML = html;
}

function clearErrors() {
    if (confirm('Удалить ошибки?')) {
        stats.errors = {};
        saveStats();
        showErrors();
    }
}

function clearAllProgress() {
    if (confirm('Сбросить всю статистику?')) {
        stats = { totalCorrect: 0, totalWrong: 0, errors: {} };
        saveStats();
        goToMain();
    }
}

// ============================================================
// ФУНКЦИИ ДЛЯ ПЕРЕВОДА
// ============================================================
function startTranslation(type) {
    let data = getLessonData(currentLesson);
    if (!data || !data.translation || !data.translation[type]) {
        document.getElementById('translationQuestion').innerHTML = '<p>Нет упражнений.</p>';
        return;
    }
    let qs = data.translation[type].slice();
    translationState = {
        type: type,
        questions: shuffle(qs),
        index: 0,
        correct: 0,
        total: qs.length,
        chosen: []
    };
    showTranslation();
}

function showTranslation() {
    let s = translationState;
    if (s.index >= s.total) {
        let p = Math.round((s.correct / s.total) * 100);
        document.getElementById('translationQuestion').innerHTML =
            '<div class="feedback ' + (p >= 70 ? 'ok' : 'fail') + '">🏁 Упражнение завершено!<br>Правильно: ' + s.correct + ' из ' + s.total + ' (' + p + '%)</div>' +
            '<button class="menu-btn primary" onclick="startTranslation(\'' + s.type + '\')">🔄 Ещё раз</button>';
        return;
    }
    let q = s.questions[s.index];
    let container = document.getElementById('translationQuestion');
    let html = '<div style="margin-bottom:8px;font-size:14px;color:#7a5f4b;">Урок ' + currentLesson + ', перевод ' + (s.index + 1) + ' из ' + s.total + '</div>';
    html += '<div class="question">' + q.source + '</div>';

    // Собираем все слова: правильные + лишние (из словаря урока)
    let lessonData = getLessonData(currentLesson);
    let vocabWords = lessonData.vocabulary ? lessonData.vocabulary.map(v => v.greek) : [];
    let allWords = [];
    if (s.type === 'ru_to_el') {
        let correctWords = q.correct;
        let extras = vocabWords.filter(w => !correctWords.includes(w));
        let chosenExtras = shuffle(extras).slice(0, 4);
        allWords = shuffle([...correctWords, ...chosenExtras]);
    } else {
        let correctWords = q.correct;
        let allTranslations = lessonData.vocabulary ? lessonData.vocabulary.map(v => v.translation) : [];
        let flat = [];
        allTranslations.forEach(t => {
            t.split(/[,;]/).forEach(w => {
                let trimmed = w.trim();
                if (trimmed) flat.push(trimmed);
            });
        });
        let extras = flat.filter(w => !correctWords.includes(w));
        let chosenExtras = shuffle(extras).slice(0, 4);
        allWords = shuffle([...correctWords, ...chosenExtras]);
    }

    html += '<div class="build-area" id="transBuildArea"></div>';
    html += '<div class="word-bank" id="transWordBank">';
    for (let w of allWords) {
        html += '<span class="chip" onclick="transPickWord(\'' + w.replace(/'/g, "\\'") + '\')">' + w + '</span>';
    }
    html += '</div>';
    html += '<button class="menu-btn primary" onclick="checkTranslation()">✅ Проверить</button> ';
    html += '<button class="menu-btn" onclick="transClear()">↩️ Очистить</button>';

    container.innerHTML = html;
    translationState.chosen = [];
}

function transPickWord(w) {
    translationState.chosen.push(w);
    let bank = document.getElementById('transWordBank');
    bank.querySelectorAll('.chip').forEach(c => {
        if (c.textContent === w && !c.classList.contains('picked')) c.classList.add('picked');
    });
    let area = document.getElementById('transBuildArea');
    let t = document.createElement('span');
    t.className = 'token';
    t.textContent = w;
    area.appendChild(t);
}

function transClear() {
    translationState.chosen = [];
    document.getElementById('transBuildArea').innerHTML = '';
    document.getElementById('transWordBank').querySelectorAll('.chip').forEach(c => c.classList.remove('picked'));
}

function checkTranslation() {
    let s = translationState;
    let q = s.questions[s.index];
    let chosen = s.chosen;
    let correct = q.correct;
    let ok = chosen.length === correct.length && chosen.every((w, i) => w === correct[i]);
    let container = document.getElementById('translationQuestion');
    if (ok) {
        stats.totalCorrect++;
        s.correct++;
        container.innerHTML = '<div class="feedback ok">✅ Верно!</div>';
    } else {
        stats.totalWrong++;
        let lesson = currentLesson;
        if (!stats.errors[lesson]) stats.errors[lesson] = [];
        stats.errors[lesson].push({ word: q.source, correct: correct.join(' '), your: chosen.join(' ') });
        container.innerHTML = '<div class="feedback fail">❌ Неверно. Правильный порядок: <strong>' + correct.join(' ') + '</strong></div>';
    }
    saveStats();
    s.index++;
    setTimeout(showTranslation, 1500);
}

loadStats();
renderMainMenu();
