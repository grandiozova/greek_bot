<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏛️ Древнегреческий тренажёр (уроки 3–10)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #f7f2eb;
            color: #2c2c2c;
            padding: 16px;
            display: flex;
            justify-content: center;
        }
        .app {
            max-width: 950px;
            width: 100%;
            background: #fff;
            border-radius: 32px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
            padding: 24px 20px;
        }
        h1 {
            font-size: 28px;
            color: #3d2a1e;
            border-bottom: 2px solid #e5d9cf;
            padding-bottom: 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        h1 small {
            font-size: 28px;
            font-weight: 400;
            color: #3d2a1e;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 16px 0;
        }
        .menu-btn {
            background: #f0eae4;
            border: 0;
            border-radius: 8px;
            padding: 14px 12px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
            text-align: center;
        }
        .menu-btn:hover {
            background: #e0d5cb;
            transform: translateY(-2px);
        }
        .menu-btn.primary {
            background: #b7a48b;
            color: #fff;
        }
        .menu-btn.primary:hover {
            background: #9e8a73;
        }
        .menu-btn.danger {
            background: #d4b8b8;
            color: #4a2e2e;
        }
        .back-btn {
            background: 0;
            border: 0;
            color: #7a5f4b;
            font-size: 15px;
            cursor: pointer;
            margin-bottom: 14px;
        }
        .back-btn:hover {
            text-decoration: underline;
        }
        .section {
            display: none;
        }
        .section.active {
            display: block;
            animation: fade 0.25s ease;
        }
        @keyframes fade {
            0% {
                opacity: 0.3;
            }
            100% {
                opacity: 1;
            }
        }
        .card {
            background: #fcf9f6;
            border-radius: 18px;
            padding: 20px 18px;
            margin-bottom: 18px;
            border: 1px solid #eee5dd;
        }
        .card h3 {
            margin-bottom: 10px;
            color: #4a3728;
            font-size: 18px;
        }
        .word-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .word-item {
            background: #ede7e0;
            border-radius: 8px;
            font-size: 15px;
            overflow: hidden;
        }
        .word-item .word-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 14px;
            cursor: pointer;
            user-select: none;
        }
        .word-item .word-row:hover {
            background: #e2d5c9;
        }
        .word-item .word-row strong {
            font-weight: 600;
            color: #3d2a1e;
        }
        .word-details {
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.3s ease, padding 0.3s ease, opacity 0.3s ease;
            padding: 0 14px;
            background: #f9f6f2;
            border-radius: 0 0 8px 8px;
            opacity: 0;
        }
        .word-details.open {
            max-height: 600px;
            padding: 8px 14px 12px;
            opacity: 1;
        }
        .word-details table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            margin: 0;
        }
        .word-details td,
        .word-details th {
            border: 1px solid #c9b9ab;
            padding: 4px 8px;
            text-align: center;
        }
        .word-details th {
            background: #ede7e0;
        }
        .grammar-text {
            font-size: 15px;
            line-height: 1.7;
            background: #f4eee8;
            padding: 16px 18px;
            border-radius: 14px;
            border-left: 4px solid #b7a48b;
        }
        .grammar-text table {
            border-collapse: collapse;
            margin: 10px 0;
            width: 100%;
            font-size: 14px;
        }
        .grammar-text td,
        .grammar-text th {
            border: 1px solid #c9b9ab;
            padding: 6px 10px;
            text-align: center;
        }
        .question {
            font-size: 19px;
            font-weight: 500;
            margin-bottom: 16px;
        }
        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 10px 0;
        }
        .option-btn {
            background: #f0eae4;
            border: 2px solid transparent;
            border-radius: 8px;
            padding: 10px 22px;
            font-size: 17px;
            cursor: pointer;
            transition: 0.1s;
            flex: 1;
            text-align: center;
        }
        .option-btn:hover {
            background: #e2d5c9;
            border-color: #b7a48b;
        }
        .option-btn.correct {
            background: #8fbc8f;
            color: #fff;
            border-color: #5f8b5f;
        }
        .option-btn.wrong {
            background: #d4a0a0;
            color: #fff;
            border-color: #b06a6a;
        }
        .feedback {
            padding: 14px 18px;
            border-radius: 14px;
            margin: 14px 0;
            font-weight: 500;
        }
        .feedback.ok {
            background: #e0f0e0;
            color: #1f5f2f;
        }
        .feedback.fail {
            background: #f0e0e0;
            color: #7a2e2e;
        }
        .input-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 10px 0;
        }
        .input-group input {
            flex: 1;
            padding: 10px 16px;
            border-radius: 8px;
            border: 2px solid #d9cec2;
            font-size: 17px;
            background: white;
            min-width: 180px;
        }
        .input-group button {
            padding: 10px 24px;
            border: 0;
            border-radius: 8px;
            background: #b7a48b;
            color: #fff;
            font-size: 17px;
            cursor: pointer;
        }
        .input-group button:hover {
            background: #9e8a73;
        }
        .word-bank {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 10px 0;
        }
        .word-bank .chip {
            background: #ede7e0;
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
            border: 2px solid transparent;
            user-select: none;
        }
        .word-bank .chip:hover {
            background: #d9cec2;
            transform: scale(1.02);
        }
        .word-bank .chip.picked {
            background: #b7a48b;
            color: #fff;
            opacity: 0.5;
            transform: scale(0.95);
            cursor: default;
        }
        .build-area {
            background: #f4eee8;
            padding: 10px 16px;
            border-radius: 8px;
            min-height: 44px;
            margin: 10px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            border: 2px dashed #c9b9ab;
        }
        .build-area .token {
            background: #b7a48b;
            color: #fff;
            padding: 4px 14px;
            border-radius: 8px;
            font-size: 17px;
        }
        .tab-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 12px 0;
        }
        .tab-bar button {
            flex: 1;
            min-width: 80px;
            padding: 10px 8px;
            border: 0;
            border-radius: 8px;
            background: #f0eae4;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        .tab-bar button.active {
            background: #b7a48b;
            color: #fff;
        }
        .tab-bar button:hover {
            background: #e0d5cb;
        }
        .flashcard-area {
            text-align: center;
            padding: 20px 0;
        }
        .flashcard-word {
            font-size: 40px;
            font-weight: 600;
            color: #3d2a1e;
            margin: 20px 0;
        }
        .flashcard-translation {
            font-size: 28px;
            color: #5f4a38;
            margin: 16px 0;
        }
        .flashcard-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .flashcard-buttons button {
            padding: 12px 32px;
            border: 0;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }
        .flashcard-buttons .show {
            background: #b7a48b;
            color: #fff;
        }
        .flashcard-buttons .know {
            background: #8fbc8f;
            color: #fff;
        }
        .flashcard-buttons .dontknow {
            background: #d4a0a0;
            color: #fff;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee5dd;
        }
        .stat-row:last-child {
            border-bottom: none;
        }
        .lesson-badge {
            background: #3d2a1e;
            color: #fff;
            padding: 2px 14px;
            border-radius: 8px;
            font-size: 14px;
            display: inline-block;
            margin-bottom: 10px;
        }
        .error-item {
            background: #fcf1f1;
            padding: 8px 14px;
            border-radius: 8px;
            margin: 4px 0;
            border-left: 4px solid #d4a0a0;
        }
        .clear-btn {
            background: none;
            border: 1px solid #d4a0a0;
            border-radius: 8px;
            padding: 6px 18px;
            color: #7a2e2e;
            cursor: pointer;
            font-size: 14px;
            margin-top: 8px;
        }
        .clear-btn:hover {
            background: #d4a0a0;
            color: #fff;
        }
        .vocab-section {
            margin-bottom: 16px;
        }
        .vocab-section h4 {
            background: #ede7e0;
            padding: 6px 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            color: #3d2a1e;
        }
        .vocab-section .word-item {
            margin-left: 8px;
        }
        @media (max-width: 600px) {
            .app {
                padding: 16px 12px;
            }
            .menu-grid {
                grid-template-columns: 1fr;
            }
            .options {
                flex-direction: column;
            }
            .option-btn {
                width: 100%;
            }
            .input-group input {
                min-width: 140px;
            }
            .tab-bar button {
                min-width: 60px;
                font-size: 13px;
                padding: 8px 6px;
            }
            .flashcard-word {
                font-size: 30px;
            }
            .flashcard-translation {
                font-size: 22px;
            }
        }
        .hidden {
            display: none !important;
        }
        .center {
            text-align: center;
        }
        .mt-12 {
            margin-top: 12px;
        }
        .mb-12 {
            margin-bottom: 12px;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .progress-text {
            font-size: 14px;
            color: #7a5f4b;
        }
        .decor-line {
            border: none;
            border-top: 2px solid #e5d9cf;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="app" id="app">

        <h1>🏛️ Древнегреческий <small>тренажёр (уроки 3–10)</small></h1>

        <!-- Главное меню -->
        <div id="mainMenu" class="section active">
            <p style="margin-bottom:14px;color:#4a3728;">Выберите урок:</p>
            <div class="menu-grid" id="lessonGrid"></div>
            <hr class="decor-line">
            <div class="menu-grid" style="grid-template-columns:1fr 1fr 1fr;">
                <button class="menu-btn" onclick="showAllVocab()">📚 Словарь всех слов</button>
                <button class="menu-btn primary" onclick="startAllFlashcards()">📇 Проверка всех слов</button>
                <button class="menu-btn" onclick="showStats()">📊 Статистика</button>
                <button class="menu-btn" onclick="showErrors()">🔄 Ошибки</button>
                <button class="menu-btn danger" onclick="clearAllProgress()">🗑️ Сброс прогресса</button>
            </div>
        </div>

        <!-- Словарь всех слов -->
        <div id="allVocabSection" class="section">
            <button class="back-btn" onclick="goToMain()">← Назад</button>
            <div class="card">
                <h3>📚 Словарь всех слов (уроки 3–10)</h3>
                <div id="allVocabContent"></div>
            </div>
        </div>

        <!-- Проверка всех слов (карточки) -->
        <div id="allFlashcardsSection" class="section">
            <button class="back-btn" onclick="goToMain()">← Назад</button>
            <div class="card">
                <h3>📇 Проверка всех слов</h3>
                <div id="allFlashcardContainer" class="flashcard-area"></div>
            </div>
        </div>

        <!-- Урок -->
        <div id="lessonSection" class="section">
            <button class="back-btn" onclick="goToMain()">← Назад</button>
            <h2 id="lessonTitle" style="margin-bottom:4px;"></h2>
            <div class="lesson-badge" id="lessonBadge">Урок 3</div>
            <div class="tab-bar">
                <button class="active" data-part="grammar" onclick="switchLessonPart('grammar')">📚 Грамматика</button>
                <button data-part="vocab" onclick="switchLessonPart('vocab')">📖 Словарь</button>
                <button data-part="exercise" onclick="switchLessonPart('exercise')">🔤 Упражнения</button>
                <button data-part="flashcards" onclick="switchLessonPart('flashcards')">📇 Карточки</button>
                <button data-part="test" onclick="startTest()">📝 Тест (10)</button>
            </div>
            <div id="partGrammar" class="section active">
                <div class="card">
                    <h3>Грамматика</h3>
                    <div class="grammar-text" id="grammarContent"></div>
                </div>
            </div>
            <div id="partVocab" class="section">
                <div class="card">
                    <h3>Словарь урока</h3>
                    <div class="word-list" id="vocabList"></div>
                </div>
            </div>
            <div id="partExercise" class="section">
                <div class="card">
                    <h3>Упражнения</h3>
                    <div id="exerciseButtons"></div>
                    <div id="exerciseQuestion" style="margin-top:16px;"></div>
                </div>
            </div>
            <div id="partFlashcards" class="section">
                <div class="card">
                    <h3>📇 Карточки</h3>
                    <div id="flashcardContainer" class="flashcard-area">
                        <p>Нажмите «Начать карточки».</p>
                        <button class="menu-btn primary" onclick="startFlashcards()">▶️ Начать карточки</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Статистика -->
        <div id="statsSection" class="section">
            <button class="back-btn" onclick="goToMain()">← Назад</button>
            <div class="card">
                <h3>📊 Статистика</h3>
                <div id="statsContent"></div>
            </div>
        </div>

        <!-- Ошибки -->
        <div id="errorsSection" class="section">
            <button class="back-btn" onclick="goToMain()">← Назад</button>
            <div class="card">
                <h3>🔄 Ошибки</h3>
                <div id="errorsContent"></div>
            </div>
        </div>

        <!-- Тест -->
        <div id="testSection" class="section">
            <button class="back-btn" onclick="cancelTest()">← Выйти</button>
            <div class="card">
                <h3>📝 Тест</h3>
                <div id="testContainer"></div>
            </div>
        </div>

    </div>

    <script>
        // ======================================================================
        // ДАННЫЕ УРОКОВ 3–10 С ПОЛНЫМИ ТАБЛИЦАМИ ДЛЯ ВСЕХ СЛОВ
        // ======================================================================

        const LESSONS_DATA = {
            3: {
                title: "Глаголы на -ω (настоящее время)",
                grammar: `<b>Окончания глаголов в настоящем времени:</b><br>
                <table><tr><th>Лицо</th><th>Ед.ч.</th><th>Мн.ч.</th></tr>
                <tr><td>1-е</td><td>-ω</td><td>-ομεν</td></tr>
                <tr><td>2-е</td><td>-εις</td><td>-ετε</td></tr>
                <tr><td>3-е</td><td>-ει</td><td>-ουσι(ν)</td></tr></table><br>
                <b>Спряжение λύω (развязываю, освобождаю):</b><br>
                <table><tr><th>Лицо</th><th>Ед.ч.</th><th>Мн.ч.</th></tr>
                <tr><td>1-е</td><td>λύω</td><td>λύομεν</td></tr>
                <tr><td>2-е</td><td>λύεις</td><td>λύετε</td></tr>
                <tr><td>3-е</td><td>λύει</td><td>λύουσι(ν)</td></tr></table><br>
                <b>Соединительный гласный:</b> перед μ и ν — ο, перед другими буквами — ε.`,
                vocabulary: [
                    { greek: "βλέπω", translation: "вижу", type: "verb",
                        declension_forms: {
                            singular: { "1": "βλέπω", "2": "βλέπεις", "3": "βλέπει" },
                            plural: { "1": "βλέπομεν", "2": "βλέπετε", "3": "βλέπουσι(ν)" }
                        }
                    },
                    { greek: "λαμβάνω", translation: "беру, получаю, принимаю", type: "verb",
                        declension_forms: {
                            singular: { "1": "λαμβάνω", "2": "λαμβάνεις", "3": "λαμβάνει" },
                            plural: { "1": "λαμβάνομεν", "2": "λαμβάνετε", "3": "λαμβάνουσι(ν)" }
                        }
                    },
                    { greek: "γινώσκω", translation: "знаю", type: "verb",
                        declension_forms: {
                            singular: { "1": "γινώσκω", "2": "γινώσκεις", "3": "γινώσκει" },
                            plural: { "1": "γινώσκομεν", "2": "γινώσκετε", "3": "γινώσκουσι(ν)" }
                        }
                    },
                    { greek: "λέγω", translation: "говорю", type: "verb",
                        declension_forms: {
                            singular: { "1": "λέγω", "2": "λέγεις", "3": "λέγει" },
                            plural: { "1": "λέγομεν", "2": "λέγετε", "3": "λέγουσι(ν)" }
                        }
                    },
                    { greek: "γράφω", translation: "пишу", type: "verb",
                        declension_forms: {
                            singular: { "1": "γράφω", "2": "γράφεις", "3": "γράφει" },
                            plural: { "1": "γράφομεν", "2": "γράφετε", "3": "γράφουσι(ν)" }
                        }
                    },
                    { greek: "λύω", translation: "развязываю, освобождаю, разрушаю, отпускаю", type: "verb",
                        declension_forms: {
                            singular: { "1": "λύω", "2": "λύεις", "3": "λύει" },
                            plural: { "1": "λύομεν", "2": "λύετε", "3": "λύουσι(ν)" }
                        }
                    },
                    { greek: "διδάσκω", translation: "учу", type: "verb",
                        declension_forms: {
                            singular: { "1": "διδάσκω", "2": "διδάσκεις", "3": "διδάσκει" },
                            plural: { "1": "διδάσκομεν", "2": "διδάσκετε", "3": "διδάσκουσι(ν)" }
                        }
                    },
                    { greek: "ἔχω", translation: "имею", type: "verb",
                        declension_forms: {
                            singular: { "1": "ἔχω", "2": "ἔχεις", "3": "ἔχει" },
                            plural: { "1": "ἔχομεν", "2": "ἔχετε", "3": "ἔχουσι(ν)" }
                        }
                    }
                ],
                exercises: {
                    declension_fill: [
                        { case: "1sg", correct: "λύω", distractors: ["λύεις", "λύει", "λύομεν"] },
                        { case: "2sg", correct: "λύεις", distractors: ["λύω", "λύει", "λύετε"] },
                        { case: "3sg", correct: "λύει", distractors: ["λύω", "λύεις", "λύουσι"] },
                        { case: "1pl", correct: "λύομεν", distractors: ["λύω", "λύετε", "λύουσι"] },
                        { case: "2pl", correct: "λύετε", distractors: ["λύομεν", "λύει", "λύουσι"] },
                        { case: "3pl", correct: "λύουσι(ν)", distractors: ["λύομεν", "λύετε", "λύει"] }
                    ],
                    translate_greek_to_russian: [
                        { greek: "βλέπω", keywords: ["вижу"] },
                        { greek: "γινώσκεις", keywords: ["знаешь"] },
                        { greek: "γράφει", keywords: ["пишет"] },
                        { greek: "διδάσκομεν", keywords: ["учим"] },
                        { greek: "ἔχετε", keywords: ["имеете"] },
                        { greek: "λαμβάνουσι", keywords: ["берут"] },
                        { greek: "λέγομεν", keywords: ["говорим"] },
                        { greek: "λύει", keywords: ["развязывает"] }
                    ],
                    translate_russian_to_greek: [
                        { russian: "я вижу", correct_sequence: ["βλέπω"], all_words: ["βλέπω", "γινώσκω", "γράφω"] },
                        { russian: "ты знаешь", correct_sequence: ["γινώσκεις"], all_words: ["γινώσκεις", "γράφεις", "βλέπεις"] },
                        { russian: "он пишет", correct_sequence: ["γράφει"], all_words: ["γράφει", "λέγει", "λύει"] }
                    ],
                    case_number: [
                        { form: "λύεις", correct: "2-е л. ед.ч.", distractors: ["1-е л. ед.ч.", "3-е л. ед.ч.", "2-е л. мн.ч."] },
                        { form: "λύομεν", correct: "1-е л. мн.ч.", distractors: ["1-е л. ед.ч.", "2-е л. мн.ч.", "3-е л. мн.ч."] }
                    ]
                }
            },

            }
            var w = s.words[s.index];
            var html = '<div style="margin-bottom:8px;font-size:14px;color:#7a5f4b;">Слово ' + (s.index + 1) + ' из ' + s.total + '</div>';
            html += '<div class="flashcard-word">' + (w.article ? w.article + ' ' : '') + w.greek + '</div>';
            if (s.revealed) {
                html += '<div class="flashcard-translation">' + w.translation + '</div><div class="flashcard-buttons"><button class="know" onclick="allFlashcardAnswer(true)">✅ Знаю</button><button class="dontknow" onclick="allFlashcardAnswer(false)">❌ Не знаю</button></div>';
            } else {
                html += '<div class="flashcard-buttons"><button class="show" onclick="allFlashcardReveal()">👁️ Показать перевод</button></div>';
            }
            container.innerHTML = html;
        }

        function allFlashcardReveal() { allFlashcardState.revealed = true;
            showAllFlashcard(); }

        function allFlashcardAnswer(know) {
            var s = allFlashcardState;
            if (know) { s.correct++;
                stats.totalCorrect++; } else {
                stats.totalWrong++;
                var w = s.words[s.index];
                if (!stats.errors['all']) stats.errors['all'] = [];
                stats.errors['all'].push({ word: w.greek, correct: w.translation, your: 'не знал' });
            }
            saveStats();
            s.index++;
            s.revealed = false;
            showAllFlashcard();
        }

        // ===== УРОК =====

        function openLesson(lesson) {
            currentLesson = lesson;
            var data = getLessonData(lesson);
            if (!data) return;
            document.getElementById('lessonTitle').textContent = data.title;
            document.getElementById('lessonBadge').textContent = 'Урок ' + lesson;
            showSection('lessonSection');
            var tabs = document.querySelectorAll('.tab-bar button');
            for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
            document.querySelector('.tab-bar button[data-part="grammar"]').classList.add('active');
            document.getElementById('grammarContent').innerHTML = data.grammar || '';

            var container = document.getElementById('vocabList');
            container.innerHTML = '';
            if (data.vocabulary) {
                for (var i = 0; i < data.vocabulary.length; i++) {
                    var item = data.vocabulary[i];
                    var article = item.article ? item.article + ' ' : '';
                    var div = document.createElement('div');
                    div.className = 'word-item';
                    // Проверяем наличие declension_forms для всех типов (объект с singular/plural или с masculine/feminine/neuter)
                    var hasForms = false;
                    if (item.declension_forms) {
                        // если есть поля singular/plural или masculine/feminine/neuter
                        if (item.declension_forms.singular || item.declension_forms.plural ||
                            item.declension_forms.masculine || item.declension_forms.feminine || item.declension_forms.neuter) {
                            hasForms = true;
                        }
                    }
                    if (hasForms) {
                        div.classList.add('clickable');
                        div.onclick = function(el) { return function() { toggleDeclension(el); }; }(div);
                    }
                    var detailsHtml = '';
                    if (hasForms) {
                        detailsHtml = '<div class="word-details">' + generateDeclensionTable(item.declension_forms) + '</div>';
                    }
                    div.innerHTML = '<div class="word-row"><strong>' + article + item.greek + '</strong><span>' + item.translation + '</span></div>' + detailsHtml;
                    container.appendChild(div);
                }
            }

            var hasExercises = false;
            if (data.exercises) {
                var keys = Object.keys(data.exercises);
                for (var i = 0; i < keys.length; i++) {
                    if (data.exercises[keys[i]] && data.exercises[keys[i]].length > 0) { hasExercises = true; break; }
                }
            }
            var btnContainer = document.getElementById('exerciseButtons');
            btnContainer.innerHTML = '';
            if (hasExercises) {
                var types = [
                    { key: 'declension_fill', label: '📐 Склонение' },
                    { key: 'translate_greek_to_russian', label: '🇬🇷→🇷🇺 Перевод' },
                    { key: 'translate_russian_to_greek', label: '🇷🇺→🇬🇷 Перевод' },
                    { key: 'case_number', label: '🎯 Падеж/число' },
                    { key: 'agreement', label: '🔗 Согласование' },
                    { key: 'attribute_vs_predicate', label: '⚖️ Атрибут/предикатив' },
                    { key: 'substantivation', label: '📌 Субстантивация' },
                    { key: 'article_fill', label: '🔤 Артикль' }
                ];
                for (var i = 0; i < types.length; i++) {
                    var qs = getExercises(lesson, types[i].key);
                    if (qs && qs.length > 0) {
                        var b = document.createElement('button');
                        b.className = 'menu-btn';
                        b.textContent = types[i].label;
                        b.onclick = function(type) { return function() { startExercise(type); }; }(types[i].key);
                        btnContainer.appendChild(b);
                    }
                }
                if (btnContainer.children.length === 0) btnContainer.innerHTML = '<p>Нет упражнений.</p>';
            } else {
                btnContainer.innerHTML = '<p>Упражнений нет.</p>';
            }
            document.getElementById('exerciseQuestion').innerHTML = '';
            document.getElementById('flashcardContainer').innerHTML =
                '<p>Нажмите «Начать карточки».</p><button class="menu-btn primary" onclick="startFlashcards()">▶️ Начать карточки</button>';
            flashcardState = { words: [], index: 0, revealed: false, correct: 0, total: 0 };
            switchLessonPart('grammar');
        }

        // ===== ФУНКЦИИ ДЛЯ ГЕНЕРАЦИИ ТАБЛИЦ =====

        function generateDeclensionTable(forms) {
            if (!forms) return '';
            var html = '';
            // Определяем тип: если есть masculine, feminine, neuter — это прилагательное или местоимение с тремя родами
            if (forms.masculine || forms.feminine || forms.neuter) {
                html += '<table><thead><tr><th>Падеж</th><th>Муж.</th><th>Жен.</th><th>Ср.</th></tr></thead><tbody>';
                var cases = ['nom', 'gen', 'dat', 'acc', 'voc'];
                var labels = { nom: 'Nom.', gen: 'Gen.', dat: 'Dat.', acc: 'Acc.', voc: 'Voc.' };
                for (var c = 0; c < cases.length; c++) {
                    var caseKey = cases[c];
                    var m = (forms.masculine && forms.masculine.singular && forms.masculine.singular[caseKey]) ? forms.masculine.singular[caseKey] : '';
                    var f = (forms.feminine && forms.feminine.singular && forms.feminine.singular[caseKey]) ? forms.feminine.singular[caseKey] : '';
                    var n = (forms.neuter && forms.neuter.singular && forms.neuter.singular[caseKey]) ? forms.neuter.singular[caseKey] : '';
                    html += '<tr><td>' + labels[caseKey] + '</td><td>' + m + '</td><td>' + f + '</td><td>' + n + '</td></tr>';
                }
                html += '</tbody></table>';
                // добавим множественное число, если есть
                var hasPlural = false;
                if (forms.masculine && forms.masculine.plural) hasPlural = true;
                else if (forms.feminine && forms.feminine.plural) hasPlural = true;
                else if (forms.neuter && forms.neuter.plural) hasPlural = true;
                if (hasPlural) {
                    html += '<table><thead><tr><th>Падеж</th><th>Муж. (мн.)</th><th>Жен. (мн.)</th><th>Ср. (мн.)</th></tr></thead><tbody>';
                    for (var c2 = 0; c2 < cases.length; c2++) {
                        var caseKey2 = cases[c2];
                        var m2 = (forms.masculine && forms.masculine.plural && forms.masculine.plural[caseKey2]) ? forms.masculine.plural[caseKey2] : '';
                        var f2 = (forms.feminine && forms.feminine.plural && forms.feminine.plural[caseKey2]) ? forms.feminine.plural[caseKey2] : '';
                        var n2 = (forms.neuter && forms.neuter.plural && forms.neuter.plural[caseKey2]) ? forms.neuter.plural[caseKey2] : '';
                        html += '<tr><td>' + labels[caseKey2] + '</td><td>' + m2 + '</td><td>' + f2 + '</td><td>' + n2 + '</td></tr>';
                    }
                    html += '</tbody></table>';
                }
                return html;
            }
            // Иначе стандартная таблица с единственным и множественным числом (для существительных, глаголов, местоимений)
            var cases = ['nom', 'gen', 'dat', 'acc', 'voc'];
            var labels = { nom: 'Nom.', gen: 'Gen.', dat: 'Dat.', acc: 'Acc.', voc: 'Voc.' };
            // Проверим, есть ли у нас данные в singular/plural
            if (forms.singular || forms.plural) {
                html += '<table><thead><tr><th>Падеж/Лицо</th><th>Ед.ч.</th><th>Мн.ч.</th></tr></thead><tbody>';
                // Для существительных используем падежи
                if (forms.singular && forms.singular.nom !== undefined) {
                    for (var c3 = 0; c3 < cases.length; c3++) {
                        var key = cases[c3];
                        var sg = (forms.singular && forms.singular[key]) ? forms.singular[key] : '';
                        var pl = (forms.plural && forms.plural[key]) ? forms.plural[key] : '';
                        html += '<tr><td>' + labels[key] + '</td><td>' + sg + '</td><td>' + pl + '</td></tr>';
                    }
                } else if (forms.singular && forms.singular["1"] !== undefined) {
                    // Глаголы и местоимения (лица)
                    var persons = ['1', '2', '3'];
                    var personLabels = ['1-е лицо', '2-е лицо', '3-е лицо'];
                    for (var p = 0; p < persons.length; p++) {
                        var sg = (forms.singular && forms.singular[persons[p]]) ? forms.singular[persons[p]] : '';
                        var pl = (forms.plural && forms.plural[persons[p]]) ? forms.plural[persons[p]] : '';
                        html += '<tr><td>' + personLabels[p] + '</td><td>' + sg + '</td><td>' + pl + '</td></tr>';
                    }
                } else {
                    // Если нет ни nom, ни "1" - просто покажем все ключи
                    var keys = Object.keys(forms.singular || {});
                    for (var k = 0; k < keys.length; k++) {
                        var key2 = keys[k];
                        var sg = forms.singular ? forms.singular[key2] : '';
                        var pl = forms.plural ? forms.plural[key2] : '';
                        html += '<tr><td>' + key2 + '</td><td>' + sg + '</td><td>' + pl + '</td></tr>';
                    }
                }
                html += '</tbody></table>';
                return html;
            }
            return '';
        }

        function toggleDeclension(el) {
            var details = el.querySelector('.word-details');
            if (details) {
                details.classList.toggle('open');
            }
        }

        // Остальные функции (switchLessonPart, startExercise, ...) остаются без изменений, они уже есть выше
        // Но я добавлю их для полноты, т.к. они используются.

        function switchLessonPart(part) {
            var tabs = document.querySelectorAll('.tab-bar button');
            for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
            var activeTab = document.querySelector('.tab-bar button[data-part="' + part + '"]');
            if (activeTab) activeTab.classList.add('active');
            var sections = document.querySelectorAll('#lessonSection .section');
            for (var i = 0; i < sections.length; i++) sections[i].classList.remove('active');
            var target = document.getElementById('part' + part.charAt(0).toUpperCase() + part.slice(1));
            if (target) target.classList.add('active');
            if (part === 'flashcards' && flashcardState.words.length === 0) startFlashcards();
        }

        function startExercise(type) {
            var questions = getExercises(currentLesson, type);
            if (!questions || questions.length === 0) { document.getElementById('exerciseQuestion').innerHTML = '<p>Нет вопросов.</p>'; return; }
            exerciseState = { type: type, questions: shuffle(questions), index: 0, correct: 0, total: questions.length };
            showExercise();
        }

        function getCaseName(caseKey) {
            var map = {
                '1sg': '1-е лицо ед.ч.',
                '2sg': '2-е лицо ед.ч.',
                '3sg': '3-е лицо ед.ч.',
                '1pl': '1-е лицо мн.ч.',
                '2pl': '2-е лицо мн.ч.',
                '3pl': '3-е лицо мн.ч.',
                'gen_sg': 'Genitivus (Род. п.)',
                'dat_sg': 'Dativus (Дат. п.)',
                'acc_sg': 'Accusativus (Вин. п.)',
                'nom_pl': 'Nominativus (Им. п.) мн.ч.',
                'gen_pl': 'Genitivus (Род. п.) мн.ч.',
                'dat_pl': 'Dativus (Дат. п.) мн.ч.',
                'acc_pl': 'Accusativus (Вин. п.) мн.ч.',
                'gen_sg_m': 'Genitivus (Род. п.) муж.р.',
                'dat_sg_f': 'Dativus (Дат. п.) жен.р.',
                'acc_sg_n': 'Accusativus (Вин. п.) ср.р.'
            };
            return map[caseKey] || caseKey;
        }

        function showExercise() {
            var s = exerciseState;
            if (s.index >= s.total) {
                var p = Math.round((s.correct / s.total) * 100);
                document.getElementById('exerciseQuestion').innerHTML = '<div class="feedback ' + (p >= 70 ? 'ok' : 'fail') + '">🏁 Упражнение завершено!<br>Правильно: ' + s.correct + ' из ' + s.total + ' (' + p + '%)</div><button class="menu-btn primary" onclick="startExercise(\'' + s.type + '\')">🔄 Ещё раз</button>';
                return;
            }
            var q = s.questions[s.index];
            var container = document.getElementById('exerciseQuestion');
            var html = '<div style="margin-bottom:8px;font-size:14px;color:#7a5f4b;">Урок ' + currentLesson + ', упражнение ' + (s.index + 1) + ' из ' + s.total + '</div>';
            if (s.type === 'declension_fill') {
                var caseName = getCaseName(q.case);
                var wordDisplay = q.word ? q.word + ' (' + q.translation + ')' : '';
                html += '<div class="question">Вставьте форму для <b>' + caseName + '</b> для слова <b>' + wordDisplay + '</b></div><div class="options">';
                var opts = shuffle([q.correct].concat(q.distractors));
                for (var i = 0; i < opts.length; i++) {
                    html += '<button class="option-btn" onclick="answerOpt(\'' + opts[i] + '\',\'' + q.correct + '\')">' + opts[i] + '</button>';
                }
                html += '</div>';
            } else if (s.type === 'translate_greek_to_russian') {
                html += '<div class="question">Переведите на русский:</div><div style="font-size:24px;text-align:center;margin:12px 0;">' + q.greek + '</div><div class="input-group"><input type="text" id="transInput" placeholder="Введите перевод..."><button onclick="checkTranslation()">✅ Проверить</button></div>';
                window._trans_q = q;
            } else if (s.type === 'translate_russian_to_greek') {
                var words = shuffle(q.all_words);
                html += '<div class="question">Переведите на греческий (выберите слова по порядку):</div><div style="font-size:20px;text-align:center;margin:12px 0;">' + q.russian + '</div><div class="build-area" id="buildArea"></div><div class="word-bank" id="wordBank">';
                for (var i = 0; i < words.length; i++) {
                    html += '<span class="chip" onclick="pickWord(\'' + words[i] + '\')">' + words[i] + '</span>';
                }
                html += '</div><button class="menu-btn primary" onclick="checkTranslationRu()">✅ Готово</button> <button class="menu-btn" onclick="clearChosen()">↩️ Очистить</button>';
                window._trans_ru = q;
                window._chosen = [];
            } else if (s.type === 'case_number') {
                html += '<div class="question">Определите падеж и число для формы: <b>' + q.form + '</b></div><div class="options">';
                var opts = shuffle([q.correct].concat(q.distractors));
                for (var i = 0; i < opts.length; i++) {
                    html += '<button class="option-btn" onclick="answerOpt(\'' + opts[i] + '\',\'' + q.correct + '\')">' + opts[i] + '</button>';
                }
                html += '</div>';
            } else if (s.type === 'agreement') {
                html += '<div class="question">Вставьте прилагательное <b>' + q.adjective + '</b> в правильной форме:<br>' + q.article + ' ____ ' + q.noun + '</div><div class="options">';
                var opts = shuffle([q.correct].concat(q.distractors));
                for (var i = 0; i < opts.length; i++) {
                    html += '<button class="option-btn" onclick="answerOpt(\'' + opts[i] + '\',\'' + q.correct + '\')">' + opts[i] + '</button>';
                }
                html += '</div>';
            } else if (s.type === 'attribute_vs_predicate') {
                html += '<div class="question">Определите, атрибутив или предикатив:<br><b>' + q.phrase + '</b></div><div class="options">';
                var opts = shuffle([q.correct].concat(q.distractors));
                for (var i = 0; i < opts.length; i++) {
                    html += '<button class="option-btn" onclick="answerOpt(\'' + opts[i] + '\',\'' + q.correct + '\')">' + opts[i] + '</button>';
                }
                html += '</div>';
            } else if (s.type === 'substantivation') {
                html += '<div class="question">Что означает:<br><b>' + q.phrase + '</b> ?</div><div class="options">';
                var opts = shuffle([q.correct].concat(q.distractors));
                for (var i = 0; i < opts.length; i++) {
                    html += '<button class="option-btn" onclick="answerOpt(\'' + opts[i] + '\',\'' + q.correct + '\')">' + opts[i] + '</button>';
                }
                html += '</div>';
            } else if (s.type === 'article_fill') {
                html += '<div class="question">Вставьте правильную форму артикля:<br>____ ' + q.noun + '</div><div class="options">';
                var opts = shuffle([q.correct_article].concat(q.distractors));
                for (var i = 0; i < opts.length; i++) {
                    html += '<button class="option-btn" onclick="answerOpt(\'' + opts[i] + '\',\'' + q.correct_article + '\')">' + opts[i] + '</button>';
                }
                html += '</div>';
            } else {
                html += '<p>Тип упражнения не поддерживается.</p>';
            }
            container.innerHTML = html;
        }

        function answerOpt(sel, corr) {
            var container = document.getElementById('exerciseQuestion');
            var btns = container.querySelectorAll('.option-btn');
            var ok = sel === corr;
            btns.forEach(function(b) { b.disabled = true; if (b.textContent === corr) b.classList.add('correct'); if (b.textContent === sel && !ok) b.classList.add('wrong'); });
            if (ok) { stats.totalCorrect++;
                exerciseState.correct++; } else {
                stats.totalWrong++;
                var lesson = currentLesson;
                if (!stats.errors[lesson]) stats.errors[lesson] = [];
                var q = exerciseState.questions[exerciseState.index];
                stats.errors[lesson].push({ word: q.word || q.greek || 'вопрос', correct: corr, your: sel });
            }
            saveStats();
            exerciseState.index++;
            setTimeout(showExercise, 1200);
        }

        function checkTranslation() {
            var inp = document.getElementById('transInput');
            if (!inp) return;
            var ans = inp.value.trim().toLowerCase();
            var q = window._trans_q;
            if (!q) return;
            var ok = true;
            for (var i = 0; i < q.keywords.length; i++) {
                if (ans.indexOf(q.keywords[i].toLowerCase()) === -1) { ok = false; break; }
            }
            var container = document.getElementById('exerciseQuestion');
            if (ok) { stats.totalCorrect++;
                exerciseState.correct++;
                container.innerHTML = '<div class="feedback ok">✅ Верно!</div>'; } else {
                stats.totalWrong++;
                var lesson = currentLesson;
                if (!stats.errors[lesson]) stats.errors[lesson] = [];
                stats.errors[lesson].push({ word: q.greek, correct: q.keywords.join(', '), your: ans });
                container.innerHTML = '<div class="feedback fail">❌ Неверно. Ключевые слова: ' + q.keywords.join(', ') + '</div>';
            }
            saveStats();
            exerciseState.index++;
            setTimeout(showExercise, 1500);
        }

        function pickWord(w) {
            window._chosen.push(w);
            var bank = document.getElementById('wordBank');
            bank.querySelectorAll('.chip').forEach(function(c) {
                if (c.textContent === w && !c.classList.contains('picked')) c.classList.add('picked');
            });
            var area = document.getElementById('buildArea');
            var t = document.createElement('span');
            t.className = 'token';
            t.textContent = w;
            area.appendChild(t);
        }

        function clearChosen() {
            window._chosen = [];
            document.getElementById('buildArea').innerHTML = '';
            document.getElementById('wordBank').querySelectorAll('.chip').forEach(function(c) { c.classList.remove('picked'); });
        }

        function checkTranslationRu() {
            var chosen = window._chosen || [];
            var q = window._trans_ru;
            if (!q) return;
            var corr = q.correct_sequence;
            var ok = chosen.length === corr.length && chosen.every(function(w, i) { return w === corr[i]; });
            var container = document.getElementById('exerciseQuestion');
            if (ok) { stats.totalCorrect++;
                exerciseState.correct++;
                container.innerHTML = '<div class="feedback ok">✅ Верно!</div>'; } else {
                stats.totalWrong++;
                var lesson = currentLesson;
                if (!stats.errors[lesson]) stats.errors[lesson] = [];
                stats.errors[lesson].push({ word: q.russian, correct: corr.join(' '), your: chosen.join(' ') });
                container.innerHTML = '<div class="feedback fail">❌ Неверно. Правильно: ' + corr.join(' ') + '</div>';
            }
            saveStats();
            exerciseState.index++;
            setTimeout(showExercise, 1500);
        }

        function startFlashcards() {
            var data = getLessonData(currentLesson);
            if (!data || !data.vocabulary || data.vocabulary.length === 0) { document.getElementById('flashcardContainer').innerHTML = '<p>Нет слов.</p>'; return; }
            var words = shuffle(data.vocabulary.map(function(item) {
                return { greek: item.greek, article: item.article || '', translation: item.translation };
            }));
            flashcardState = { words: words, index: 0, revealed: false, correct: 0, total: words.length };
            showFlashcard();
        }

        function showFlashcard() {
            var s = flashcardState;
            var container = document.getElementById('flashcardContainer');
            if (s.index >= s.total) {
                var p = Math.round((s.correct / s.total) * 100);
                container.innerHTML = '<div style="margin-bottom:8px;font-size:14px;color:#7a5f4b;">Урок ' + currentLesson + '</div><div class="feedback ' + (p >= 70 ? 'ok' : 'fail') + '">🏁 Карточки завершены!<br>Знаю: ' + s.correct + ' из ' + s.total + ' (' + p + '%)</div><button class="menu-btn primary" onclick="startFlashcards()">🔄 Повторить</button>';
                return;
            }
            var w = s.words[s.index];
            var html = '<div style="margin-bottom:8px;font-size:14px;color:#7a5f4b;">Урок ' + currentLesson + ', карточка ' + (s.index + 1) + ' из ' + s.total + '</div>';
            html += '<div class="flashcard-word">' + (w.article ? w.article + ' ' : '') + w.greek + '</div>';
            if (s.revealed) {
                html += '<div class="flashcard-translation">' + w.translation + '</div><div class="flashcard-buttons"><button class="know" onclick="flashAnswer(true)">✅ Знаю</button><button class="dontknow" onclick="flashAnswer(false)">❌ Не знаю</button></div>';
            } else {
                html += '<div class="flashcard-buttons"><button class="show" onclick="flashReveal()">👁️ Показать перевод</button></div>';
            }
            container.innerHTML = html;
        }

        function flashReveal() { flashcardState.revealed = true;
            showFlashcard(); }

        function flashAnswer(know) {
            var s = flashcardState;
            if (know) { s.correct++;
                stats.totalCorrect++; } else {
                stats.totalWrong++;
                var lesson = currentLesson;
                var w = s.words[s.index];
                if (!stats.errors[lesson]) stats.errors[lesson] = [];
                stats.errors[lesson].push({ word: w.greek, correct: w.translation, your: 'не знал' });
            }
            saveStats();
            s.index++;
            s.revealed = false;
            showFlashcard();
        }

        function startTest() {
            var data = getLessonData(currentLesson);
            if (!data) return;
            var all = [];
            var types = ['declension_fill', 'translate_greek_to_russian', 'translate_russian_to_greek', 'case_number', 'agreement', 'attribute_vs_predicate', 'substantivation', 'article_fill'];
            for (var t = 0; t < types.length; t++) {
                var qs = data.exercises[types[t]] || [];
                for (var i = 0; i < qs.length; i++) {
                    var q = qs[i];
                    q._type = types[t];
                    all.push(q);
                }
            }
            if (all.length === 0) { alert('Нет вопросов.'); return; }
            testState = { questions: shuffle(all).slice(0, 10), index: 0, correct: 0, total: 10, answered: false };
            showSection('testSection');
            showTest();
        }

        function cancelTest() {
            testState = { questions: [], index: 0, correct: 0, total: 0, answered: false };
            showSection('lessonSection');
            switchLessonPart('exercise');
        }

        function showTest() {
            var s = testState;
            if (s.index >= s.total) {
                var p = Math.round((s.correct / s.total) * 100);
                document.getElementById('testContainer').innerHTML = '<div style="margin-bottom:8px;font-size:14px;color:#7a5f4b;">Урок ' + currentLesson + '</div><div class="feedback ' + (p >= 70 ? 'ok' : 'fail') + '">🏁 Тест завершён!<br>Правильно: ' + s.correct + ' из ' + s.total + ' (' + p + '%)</div><button class="menu-btn primary" onclick="startTest()">🔄 Повторить</button><button class="menu-btn" onclick="cancelTest()">🔙 Назад</button>';
                return;
            }
            var q = s.questions[s.index];
            var container = document.getElementById('testContainer');
            var html = '<div style="margin-bottom:8px;font-size:14px;color:#7a5f4b;">Урок ' + currentLesson + ', вопрос ' + (s.index + 1) + ' из ' + s.total + '</div>';
            var t = q._type;

            if (t === 'declension_fill' || t === 'case_number' || t === 'agreement' ||
                t === 'attribute_vs_predicate' || t === 'substantivation' || t === 'article_fill') {
                var text = '';
                if (t === 'declension_fill') {
                    var caseName = getCaseName(q.case);
                    var wordDisplay = q.word ? q.word + ' (' + q.translation + ')' : '';
                    text = 'Вставьте форму для <b>' + caseName + '</b> для слова <b>' + wordDisplay + '</b>';
                } else if (t === 'case_number') {
                    text = 'Определите падеж и число: <b>' + q.form + '</b>';
                } else if (t === 'agreement') {
                    text = 'Вставьте прилагательное <b>' + q.adjective + '</b>: ' + q.article + ' ____ ' + q.noun;
                } else if (t === 'attribute_vs_predicate') {
                    text = 'Атрибутив или предикатив? <b>' + q.phrase + '</b>';
                } else if (t === 'substantivation') {
                    text = 'Что означает? <b>' + q.phrase + '</b>';
                } else if (t === 'article_fill') {
                    text = 'Вставьте артикль: ____ ' + q.noun;
                }
                var corr = q.correct || q.correct_article;
                var opts = shuffle([corr].concat(q.distractors));
                html += '<div class="question">' + text + '</div><div class="options">';
                for (var i = 0; i < opts.length; i++) {
                    html += '<button class="option-btn" onclick="testAnswer(\'' + opts[i] + '\',\'' + corr + '\')">' + opts[i] + '</button>';
                }
                html += '</div>';
            } else if (t === 'translate_greek_to_russian') {
                html += '<div class="question">Переведите: <b>' + q.greek + '</b></div><div class="input-group"><input type="text" id="testTransInput" placeholder="Введите перевод..."><button onclick="testTranslation()">✅ Проверить</button></div>';
                window._test_q = q;
            } else if (t === 'translate_russian_to_greek') {
                var words = shuffle(q.all_words);
                html += '<div class="question">Переведите на греческий (выберите слова по порядку):<br>' + q.russian + '</div>';
                html += '<div class="build-area" id="testBuildArea"></div><div class="word-bank" id="testWordBank">';
                for (var i = 0; i < words.length; i++) {
                    html += '<span class="chip" onclick="testPickWord(\'' + words[i] + '\')">' + words[i] + '</span>';
                }
                html += '</div><button class="menu-btn primary" onclick="testTranslationRu()">✅ Готово</button> <button class="menu-btn" onclick="testClearChosen()">↩️ Очистить</button>';
                window._test_ru = q;
                window._test_chosen = [];
            } else {
                html += '<p>Неизвестный тип вопроса.</p>';
            }
            container.innerHTML = html;
            s.answered = false;
        }

        function testAnswer(sel, corr) {
            if (testState.answered) return;
            testState.answered = true;
            var ok = sel === corr;
            if (ok) testState.correct++;
            else {
                stats.totalWrong++;
                var lesson = currentLesson;
                if (!stats.errors[lesson]) stats.errors[lesson] = [];
                var q = testState.questions[testState.index];
                stats.errors[lesson].push({ word: q.word || q.greek || 'вопрос', correct: corr, your: sel });
            }
            stats.totalCorrect += ok ? 1 : 0;
            saveStats();
            var container = document.getElementById('testContainer');
            if (ok) { container.innerHTML = '<div class="feedback ok">✅ Верно!</div>'; } else {
                container.innerHTML = '<div class="feedback fail">❌ Неверно. Правильный ответ: <strong>' + corr + '</strong></div>';
            }
            setTimeout(function() { testState.index++;
                showTest(); }, 1500);
        }

        function testTranslation() {
            if (testState.answered) return;
            var inp = document.getElementById('testTransInput');
            if (!inp) return;
            var ans = inp.value.trim().toLowerCase();
            var q = window._test_q;
            if (!q) return;
            var ok = true;
            for (var i = 0; i < q.keywords.length; i++) {
                if (ans.indexOf(q.keywords[i].toLowerCase()) === -1) { ok = false; break; }
            }
            var container = document.getElementById('testContainer');
            if (ok) { testState.correct++;
                stats.totalCorrect++;
                container.innerHTML = '<div class="feedback ok">✅ Верно!</div>'; } else {
                stats.totalWrong++;
                var lesson = currentLesson;
                if (!stats.errors[lesson]) stats.errors[lesson] = [];
                stats.errors[lesson].push({ word: q.greek, correct: q.keywords.join(', '), your: ans });
                container.innerHTML = '<div class="feedback fail">❌ Неверно. Ключевые слова: ' + q.keywords.join(', ') + '</div>';
            }
            saveStats();
            testState.answered = true;
            setTimeout(function() { testState.index++;
                showTest(); }, 1500);
        }

        function testPickWord(w) {
            if (testState.answered) return;
            window._test_chosen.push(w);
            var bank = document.getElementById('testWordBank');
            bank.querySelectorAll('.chip').forEach(function(c) {
                if (c.textContent === w && !c.classList.contains('picked')) c.classList.add('picked');
            });
            var area = document.getElementById('testBuildArea');
            var t = document.createElement('span');
            t.className = 'token';
            t.textContent = w;
            area.appendChild(t);
        }

        function testClearChosen() {
            window._test_chosen = [];
            document.getElementById('testBuildArea').innerHTML = '';
            document.getElementById('testWordBank').querySelectorAll('.chip').forEach(function(c) { c.classList.remove('picked'); });
        }

        function testTranslationRu() {
            if (testState.answered) return;
            var chosen = window._test_chosen || [];
            var q = window._test_ru;
            if (!q) return;
            var corr = q.correct_sequence;
            var ok = chosen.length === corr.length && chosen.every(function(w, i) { return w === corr[i]; });
            var container = document.getElementById('testContainer');
            if (ok) { testState.correct++;
                stats.totalCorrect++;
                container.innerHTML = '<div class="feedback ok">✅ Верно!</div>'; } else {
                stats.totalWrong++;
                var lesson = currentLesson;
                if (!stats.errors[lesson]) stats.errors[lesson] = [];
                stats.errors[lesson].push({ word: q.russian, correct: corr.join(' '), your: chosen.join(' ') });
                container.innerHTML = '<div class="feedback fail">❌ Неверно. Правильно: ' + corr.join(' ') + '</div>';
            }
            saveStats();
            testState.answered = true;
            setTimeout(function() { testState.index++;
                showTest(); }, 1500);
        }

        function showStats() {
            showSection('statsSection');
            document.getElementById('statsContent').innerHTML =
                '<div class="stat-row"><span>✅ Правильных:</span><span>' + stats.totalCorrect + '</span></div><div class="stat-row"><span>❌ Неправильных:</span><span>' + stats.totalWrong + '</span></div><div class="stat-row"><span>📚 Уроков с ошибками:</span><span>' + Object.keys(stats.errors).length + '</span></div>';
        }

        function showErrors() {
            showSection('errorsSection');
            var content = document.getElementById('errorsContent');
            var err = stats.errors;
            if (!err || Object.keys(err).length === 0) { content.innerHTML = '<p>🎉 Ошибок нет!</p>'; return; }
            var html = '';
            var lessons = Object.keys(err);
            for (var i = 0; i < lessons.length; i++) {
                var lesson = lessons[i];
                var items = err[lesson];
                html += '<div style="margin-bottom:12px;"><strong>Урок ' + lesson + '</strong></div>';
                for (var j = 0; j < items.length; j++) {
                    html += '<div class="error-item">' + items[j].word + ' → правильно: <strong>' + items[j].correct + '</strong>, вы: ' + items[j].your + '</div>';
                }
            }
            html += '<button class="clear-btn" onclick="clearErrors()">🗑️ Очистить ошибки</button>';
            content.innerHTML = html;
        }

        function clearErrors() { if (confirm('Удалить ошибки?')) { stats.errors = {};
                saveStats();
                showErrors(); } }

        function clearAllProgress() { if (confirm('Сбросить всю статистику?')) { stats = { totalCorrect: 0, totalWrong: 0, errors: {} };
                saveStats();
                goToMain(); } }

        loadStats();
        renderMainMenu();
    </script>
</body>
</html>
