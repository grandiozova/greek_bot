<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏛️ Древнегреческий учебник в кармане (уроки 1–10)</title>
<style>
    :root {
        --bg: #f7f2eb;
        --app-bg: #ffffff;
        --text: #2c2c2c;
        --text-soft: #7a5f4b;
        --text-dark: #3d2a1e;
        --border: #e5d9cf;
        --card-bg: #fcf9f6;
        --card-border: #eee5dd;
        --btn-bg: #f0eae4;
        --btn-hover: #e0d5cb;
        --primary: #b7a48b;
        --primary-hover: #9e8a73;
        --danger-bg: #d4b8b8;
        --danger-text: #4a2e2e;
        --word-item-bg: #ede7e0;
        --word-item-hover: #e2d5c9;
        --word-details-bg: #f9f6f2;
        --table-border: #c9b9ab;
        --grammar-bg: #f4eee8;
        --ok-bg: #e0f0e0;
        --ok-text: #1f5f2f;
        --fail-bg: #f0e0e0;
        --fail-text: #7a2e2e;
        --input-border: #d9cec2;
        --input-bg: #ffffff;
        --chip-bg: #ede7e0;
        --chip-hover: #d9cec2;
        --build-bg: #f4eee8;
        --build-border: #c9b9ab;
        --token-bg: #b7a48b;
        --correct-bg: #8fbc8f;
        --correct-border: #5f8b5f;
        --wrong-bg: #d4a0a0;
        --wrong-border: #b06a6a;
        --error-bg: #fcf1f1;
        --shadow: rgba(0, 0, 0, 0.08);
    }

    [data-theme="dark"] {
        --bg: #1a1613;
        --app-bg: #24201c;
        --text: #ece6dd;
        --text-soft: #b8a894;
        --text-dark: #f0e6d8;
        --border: #3a332c;
        --card-bg: #2c2620;
        --card-border: #3a332c;
        --btn-bg: #34302a;
        --btn-hover: #423c33;
        --primary: #a68f6b;
        --primary-hover: #bfa87f;
        --danger-bg: #5c3a3a;
        --danger-text: #f0d6d6;
        --word-item-bg: #322c25;
        --word-item-hover: #423a30;
        --word-details-bg: #201c18;
        --table-border: #4a4238;
        --grammar-bg: #221f1a;
        --ok-bg: #1f3d24;
        --ok-text: #a3d9ad;
        --fail-bg: #3d2323;
        --fail-text: #e0a3a3;
        --input-border: #4a4238;
        --input-bg: #201c18;
        --chip-bg: #322c25;
        --chip-hover: #423a30;
        --build-bg: #221f1a;
        --build-border: #4a4238;
        --token-bg: #a68f6b;
        --correct-bg: #3d6b45;
        --correct-border: #5f8b5f;
        --wrong-bg: #8b4a4a;
        --wrong-border: #b06a6a;
        --error-bg: #2e1f1f;
        --shadow: rgba(0, 0, 0, 0.4);
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    body {
        font-family: 'Segoe UI', system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 16px;
        display: flex;
        justify-content: center;
        transition: background 0.3s ease, color 0.3s ease;
    }
    .app {
        max-width: 950px;
        width: 100%;
        background: var(--app-bg);
        border-radius: 32px;
        box-shadow: 0 12px 40px var(--shadow);
        padding: 24px 20px;
        transition: background 0.3s ease;
    }
    h1 {
        font-size: 28px;
        color: var(--text-dark);
        border-bottom: 2px solid var(--border);
        padding-bottom: 14px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 6px;
    }
    h1 .title-text {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
    }
    h1 small {
        font-size: 28px;
        font-weight: 400;
        color: var(--text-dark);
    }
    .theme-toggle {
        background: var(--btn-bg);
        border: 2px solid var(--border);
        border-radius: 999px;
        width: 44px;
        height: 44px;
        font-size: 20px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.2s;
        flex-shrink: 0;
    }
    .theme-toggle:hover {
        background: var(--btn-hover);
        transform: scale(1.08);
    }
    .menu-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin: 16px 0;
    }
    .menu-btn {
        background: var(--btn-bg);
        border: 0;
        border-radius: 8px;
        padding: 14px 12px;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        transition: 0.15s;
        text-align: center;
        color: var(--text);
    }
    .menu-btn:hover {
        background: var(--btn-hover);
        transform: translateY(-2px);
    }
    .menu-btn.primary {
        background: var(--primary);
        color: #fff;
    }
    .menu-btn.primary:hover {
        background: var(--primary-hover);
    }
    .menu-btn.danger {
        background: var(--danger-bg);
        color: var(--danger-text);
    }
    .back-btn {
        background: 0;
        border: 0;
        color: var(--text-soft);
        font-size: 15px;
        cursor: pointer;
        margin-bottom: 14px;
    }
    .back-btn:hover {
        text-decoration: underline;
    }
    .section {
        display: none;
    }
    .section.active {
        display: block;
        animation: fade 0.25s ease;
    }
    @keyframes fade {
        0% { opacity: 0.3; }
        100% { opacity: 1; }
    }
    .card {
        background: var(--card-bg);
        border-radius: 18px;
        padding: 20px 18px;
        margin-bottom: 18px;
        border: 1px solid var(--card-border);
    }
    .card h3 {
        margin-bottom: 10px;
        color: var(--text-dark);
        font-size: 18px;
    }
    .word-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }
    .search-box {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--input-bg);
        border: 2px solid var(--input-border);
        border-radius: 12px;
        padding: 10px 14px;
        margin-bottom: 14px;
    }
    .search-box input {
        border: 0;
        outline: none;
        background: transparent;
        font-size: 16px;
        flex: 1;
        color: var(--text);
    }
    .search-box .search-icon {
        font-size: 16px;
        opacity: 0.6;
    }
    .search-clear {
        background: none;
        border: 0;
        cursor: pointer;
        font-size: 16px;
        opacity: 0.5;
        display: none;
    }
    .search-clear.show { display: block; }
    .search-empty {
        text-align: center;
        color: var(--text-soft);
        padding: 20px;
        font-size: 15px;
    }
    .word-item {
        background: var(--word-item-bg);
        border-radius: 8px;
        font-size: 15px;
        overflow: hidden;
    }
    .word-item .word-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 5px 14px;
        cursor: pointer;
        user-select: none;
    }
    .word-item .word-row:hover {
        background: var(--word-item-hover);
    }
    .word-item .word-row strong {
        font-weight: 600;
        color: var(--text-dark);
    }
    .word-details {
        overflow: hidden;
        max-height: 0;
        transition: max-height 0.3s ease, padding 0.3s ease, opacity 0.3s ease;
        padding: 0 14px;
        background: var(--word-details-bg);
        border-radius: 0 0 8px 8px;
        opacity: 0;
    }
    .word-details.open {
        max-height: 600px;
        padding: 8px 14px 12px;
        opacity: 1;
    }
    .word-details table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
        margin: 0;
    }
    .word-details td, .word-details th {
        border: 1px solid var(--table-border);
        padding: 4px 8px;
        text-align: center;
        color: var(--text);
    }
    .word-details th {
        background: var(--word-item-bg);
    }
    .grammar-text {
        font-size: 15px;
        line-height: 1.7;
        background: var(--grammar-bg);
        padding: 16px 18px;
        border-radius: 14px;
        border-left: 4px solid var(--primary);
        color: var(--text);
    }
    .grammar-text table {
        border-collapse: collapse;
        margin: 10px 0;
        width: 100%;
        font-size: 14px;
    }
    .grammar-text td, .grammar-text th {
        border: 1px solid var(--table-border);
        padding: 6px 10px;
        text-align: center;
    }
    .question {
        font-size: 19px;
        font-weight: 500;
        margin-bottom: 16px;
    }
    .options {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 10px 0;
    }
    .option-btn {
        background: var(--btn-bg);
        border: 2px solid transparent;
        border-radius: 8px;
        padding: 10px 22px;
        font-size: 17px;
        cursor: pointer;
        transition: 0.1s;
        flex: 1;
        text-align: center;
        color: var(--text);
    }
    .option-btn:hover {
        background: var(--btn-hover);
        border-color: var(--primary);
    }
    .option-btn.correct {
        background: var(--correct-bg);
        color: #fff;
        border-color: var(--correct-border);
    }
    .option-btn.wrong {
        background: var(--wrong-bg);
        color: #fff;
        border-color: var(--wrong-border);
    }
    .feedback {
        padding: 14px 18px;
        border-radius: 14px;
        margin: 14px 0;
        font-weight: 500;
    }
    .feedback.ok {
        background: var(--ok-bg);
        color: var(--ok-text);
    }
    .feedback.fail {
        background: var(--fail-bg);
        color: var(--fail-text);
    }
    .input-group {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin: 10px 0;
    }
    .input-group input {
        flex: 1;
        padding: 10px 16px;
        border-radius: 8px;
        border: 2px solid var(--input-border);
        font-size: 17px;
        background: var(--input-bg);
        color: var(--text);
        min-width: 180px;
    }
    .input-group button {
        padding: 10px 24px;
        border: 0;
        border-radius: 8px;
        background: var(--primary);
        color: #fff;
        font-size: 17px;
        cursor: pointer;
    }
    .input-group button:hover {
        background: var(--primary-hover);
    }
    .word-bank {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 10px 0;
    }
    .word-bank .chip {
        background: var(--chip-bg);
        color: var(--text);
        padding: 8px 18px;
        border-radius: 8px;
        font-size: 17px;
        cursor: pointer;
        border: 2px solid transparent;
        user-select: none;
    }
    .word-bank .chip:hover {
        background: var(--chip-hover);
        transform: scale(1.02);
    }
    .word-bank .chip.picked {
        background: var(--primary);
        color: #fff;
        opacity: 0.5;
        transform: scale(0.95);
        cursor: default;
    }
    .build-area {
        background: var(--build-bg);
        padding: 10px 16px;
        border-radius: 8px;
        min-height: 44px;
        margin: 10px 0;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        border: 2px dashed var(--build-border);
    }
    .build-area .token {
        background: var(--token-bg);
        color: #fff;
        padding: 4px 14px;
        border-radius: 8px;
        font-size: 17px;
    }
    .tab-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 12px 0;
    }
    .tab-bar button {
        flex: 1;
        min-width: 80px;
        padding: 10px 8px;
        border: 0;
        border-radius: 8px;
        background: var(--btn-bg);
        color: var(--text);
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
    }
    .tab-bar button.active {
        background: var(--primary);
        color: #fff;
    }
    .tab-bar button:hover {
        background: var(--btn-hover);
    }
    .flashcard-area {
        text-align: center;
        padding: 20px 0;
    }
    .flashcard-word {
        font-size: 40px;
        font-weight: 600;
        color: var(--text-dark);
        margin: 20px 0;
    }
    .flashcard-translation {
        font-size: 28px;
        color: var(--text-soft);
        margin: 16px 0;
    }
    .flashcard-buttons {
        display: flex;
        gap: 16px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 20px;
    }
    .flashcard-buttons button {
        padding: 12px 32px;
        border: 0;
        border-radius: 8px;
        font-size: 18px;
        cursor: pointer;
    }
    .flashcard-buttons .show {
        background: var(--primary);
        color: #fff;
    }
    .flashcard-buttons .know {
        background: var(--correct-bg);
        color: #fff;
    }
    .flashcard-buttons .dontknow {
        background: var(--wrong-bg);
        color: #fff;
    }
    .stat-row {
        display: flex;
        justify-content: space-between;
        padding: 8px 0;
        border-bottom: 1px solid var(--card-border);
    }
    .stat-row:last-child {
        border-bottom: none;
    }
    .lesson-badge {
        background: var(--text-dark);
        color: var(--app-bg);
        padding: 2px 14px;
        border-radius: 8px;
        font-size: 14px;
        display: inline-block;
        margin-bottom: 10px;
    }
    .error-item {
        background: var(--error-bg);
        padding: 8px 14px;
        border-radius: 8px;
        margin: 4px 0;
        border-left: 4px solid var(--wrong-bg);
        color: var(--text);
    }
    .clear-btn {
        background: none;
        border: 1px solid var(--wrong-bg);
        border-radius: 8px;
        padding: 6px 18px;
        color: var(--fail-text);
        cursor: pointer;
        font-size: 14px;
        margin-top: 8px;
    }
    .clear-btn:hover {
        background: var(--wrong-bg);
        color: #fff;
    }
    .vocab-section {
        margin-bottom: 16px;
    }
    .vocab-section h4 {
        background: var(--word-item-bg);
        padding: 6px 12px;
        border-radius: 8px;
        margin-bottom: 6px;
        color: var(--text-dark);
    }
    .vocab-section .word-item {
        margin-left: 8px;
    }
    .hidden { display: none !important; }
    .center { text-align: center; }
    .mt-12 { margin-top: 12px; }
    .mb-12 { margin-bottom: 12px; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .progress-text { font-size: 14px; color: var(--text-soft); }
    .decor-line { border: none; border-top: 2px solid var(--border); margin: 20px 0; }
    [id^="analysis-"] {
        transition: opacity 0.3s ease;
    }
    @media (max-width: 600px) {
        .app { padding: 16px 12px; }
        .menu-grid { grid-template-columns: 1fr; }
        .options { flex-direction: column; }
        .option-btn { width: 100%; }
        .input-group input { min-width: 140px; }
        .tab-bar button { min-width: 60px; font-size: 13px; padding: 8px 6px; }
        .flashcard-word { font-size: 30px; }
        .flashcard-translation { font-size: 22px; }
        h1 { font-size: 22px; }
        h1 small { font-size: 22px; }
    }
    @media (max-width: 600px) {
        .app { padding: 12px 8px; }
        .word-item .word-row { padding: 8px 10px; font-size: 16px; }
        .menu-btn { padding: 12px 8px; font-size: 14px; }
        .tab-bar button { min-width: 50px; font-size: 12px; padding: 8px 4px; }
        .flashcard-word { font-size: 28px; }
        .flashcard-translation { font-size: 20px; }
        .option-btn { padding: 12px 16px; font-size: 16px; }
        .input-group input { font-size: 16px; padding: 10px 12px; min-width: 120px; }
        .input-group button { padding: 10px 16px; font-size: 16px; }
        .build-area .token { font-size: 15px; padding: 4px 10px; }
        .word-bank .chip { padding: 6px 12px; font-size: 15px; }
        .grammar-text { font-size: 14px; padding: 12px 14px; }
        .grammar-text table { font-size: 12px; }
        .grammar-text td, .grammar-text th { padding: 4px 6px; }
    }
</style>
</head>
<body>
<div class="app" id="app">

<h1>
    <span class="title-text">🏛️ <small>Древнегреческий учебник в кармане (уроки 1–10)</small></span>
    <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()" title="Сменить тему">🌙</button>
</h1>

<!-- Главное меню -->
<div id="mainMenu" class="section active">
    <p style="margin-bottom:14px;color:#4a3728;">Выберите урок:</p>
    <div class="menu-grid" id="lessonGrid"></div>
    <hr class="decor-line">
    <div class="menu-grid" style="grid-template-columns:1fr 1fr 1fr;">
        <button class="menu-btn" onclick="showAllVocab()">📚 Словарь всех слов</button>
        <button class="menu-btn primary" onclick="startAllFlashcards()">📇 Проверка всех слов</button>
        <button class="menu-btn" onclick="showStats()">📊 Статистика</button>
        <button class="menu-btn" onclick="showErrors()">🔄 Ошибки</button>
        <button class="menu-btn danger" onclick="clearAllProgress()">🗑️ Сброс прогресса</button>
        <button class="menu-btn primary" onclick="showPrayer()">📜 Отче наш</button>
    </div>
</div>

<!-- Словарь всех слов -->
<div id="allVocabSection" class="section">
    <button class="back-btn" onclick="goToMain()">← Назад</button>
    <div class="card">
        <h3>📚 Словарь всех слов (уроки 1–10)</h3>
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="vocabSearchInput" placeholder="Поиск по-гречески или по-русски..." oninput="filterAllVocab()">
            <button class="search-clear" id="vocabSearchClear" onclick="clearVocabSearch()">✕</button>
        </div>
        <div id="allVocabContent"></div>
    </div>
</div>

<!-- Проверка всех слов (карточки) -->
<div id="allFlashcardsSection" class="section">
    <button class="back-btn" onclick="goToMain()">← Назад</button>
    <div class="card"><h3>📇 Проверка всех слов</h3><div id="allFlashcardContainer" class="flashcard-area"></div></div>
</div>

<!-- Урок -->
<div id="lessonSection" class="section">
    <button class="back-btn" onclick="goToMain()">← Назад</button>
    <h2 id="lessonTitle" style="margin-bottom:4px;"></h2>
    <div class="lesson-badge" id="lessonBadge">Урок 3</div>
    <div class="tab-bar">
        <button class="active" data-part="grammar" onclick="switchLessonPart('grammar')">📚 Грамматика</button>
        <button data-part="vocab" onclick="switchLessonPart('vocab')">📖 Словарь</button>
        <button data-part="exercise" onclick="switchLessonPart('exercise')">🔤 Упражнения</button>
        <button data-part="flashcards" onclick="switchLessonPart('flashcards')">📇 Карточки</button>
        <button data-part="test" onclick="startTest()">📝 Тест (10)</button>
        <button data-part="translation" onclick="switchLessonPart('translation')">🌍 Перевод</button>
    </div>
    <div id="partGrammar" class="section active"><div class="card"><h3>Грамматика</h3><div class="grammar-text" id="grammarContent"></div></div></div>
    <div id="partVocab" class="section"><div class="card"><h3>Словарь урока</h3><div class="word-list" id="vocabList"></div></div></div>
    <div id="partExercise" class="section"><div class="card"><h3>Упражнения</h3><div id="exerciseButtons"></div><div id="exerciseQuestion" style="margin-top:16px;"></div></div></div>
    <div id="partFlashcards" class="section"><div class="card"><h3>📇 Карточки</h3><div id="flashcardContainer" class="flashcard-area"><p>Нажмите «Начать карточки».</p><button class="menu-btn primary" onclick="startFlashcards()">▶️ Начать карточки</button></div></div></div>
    <div id="partTranslation" class="section"><div class="card"><h3>🌍 Перевод</h3><div id="translationButtons"></div><div id="translationQuestion" style="margin-top:16px;"></div></div></div>

    <!-- Навигация между уроками (внизу) -->
    <div id="lessonNav" style="margin-top: 16px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;">
        <button class="menu-btn" id="prevLessonBtn" onclick="goToPrevLesson()" style="flex: 1; min-width: 120px;">⬅️ Предыдущий урок</button>
        <button class="menu-btn" onclick="goToMain()" style="flex: 0.5; min-width: 100px;">🏠 Меню</button>
        <button class="menu-btn primary" id="nextLessonBtn" onclick="goToNextLesson()" style="flex: 1; min-width: 120px;">Следующий урок ➡️</button>
    </div>
</div>

<!-- Статистика -->
<div id="statsSection" class="section"><button class="back-btn" onclick="goToMain()">← Назад</button><div class="card"><h3>📊 Статистика</h3><div id="statsContent"></div></div></div>

<!-- Ошибки -->
<div id="errorsSection" class="section"><button class="back-btn" onclick="goToMain()">← Назад</button><div class="card"><h3>🔄 Ошибки</h3><div id="errorsContent"></div></div></div>

<!-- Тест -->
<div id="testSection" class="section"><button class="back-btn" onclick="cancelTest()">← Выйти</button><div class="card"><h3>📝 Тест</h3><div id="testContainer"></div></div></div>
<!-- Отче наш -->
<div id="prayerSection" class="section">

<b>7. Правило «чистой» и «нечистой» альфы (подробно)</b><br>
• Если в Nom. Sing. стоит окончание <b>-α</b>, то:
  - после <b>ε, ι, ρ</b> (чистая альфа) она сохраняется во всех падежах: <b>α</b>
  - после других согласных (нечистая альфа) она переходит в <b>η</b> в Gen. и Dat. Sing.<br>
• Если в Nom. Sing. стоит окончание <b>-η</b>, то оно сохраняется во всех падежах.<br>
• В Dat. Sing. всегда пишется <b>ι</b> подписная: <b>ᾳ</b> (для слов на -α) или <b>ῃ</b> (для слов на -η).<br><br>

grammar: `<b>1. Прилагательные 1-2 склонения</b><br>
Прилагательные 1-2 склонения изменяются по трём родам:<br>
• <b>мужской род</b> — окончание <b>-ος</b> (как 2-е склонение)<br>
• <b>женский род</b> — окончание <b>-η</b> или <b>-α</b><br>
• <b>средний род</b> — окончание <b>-ον</b> (как 2-е склонение)<br><br>
<b>Особенности женского рода:</b><br>
• После букв <b>ε, ι, ρ</b> в женском роде используется окончание <b>-α</b> (а не -η)<br>
• Пример: δίκαιος → δικαία (справедливая)<br>
• В остальных случаях — окончание <b>-η</b><br>
• Пример: ἀγαθός → ἀγαθή (хорошая)<br><br>

<b>4. Употребление прилагательных: атрибутивное и предикативное</b><br>
• <b>Атрибутивное</b> (прилагательное стоит перед существительным и согласуется с ним в роде, числе и падеже).<br>
  Пример: <i>ὁ ἀγαθὸς ἄνθρωπος</i> — «хороший человек» (прилагательное с артиклем).<br>
• <b>Предикативное</b> (прилагательное стоит после существительного и является частью сказуемого).<br>
  Пример: <i>ὁ ἄνθρωπος ἀγαθός</i> — «человек хорош» (прилагательное без артикля).<br><br>

<b>5. Субстантивация прилагательных</b><br>
Прилагательные могут употребляться как существительные (с артиклем).<br>
• <i>οἱ ἀγαθοί</i> — «хорошие (люди)»<br>
• <i>τὸ καλόν</i> — «красивое (дело / вещь)»<br>
• <i>τὰ κακά</i> — «плохие (дела / вещи)»<br>
• <i>οἱ δίκαιοι</i> — «справедливые (люди)»<br><br>

• <b>πρῶτος, -η, -ον</b> — первый<br>
• <b>ἔσχατος, -η, -ον</b> — последний<br>
• <b>νεκρός, -ά, -όν</b> — мёртвый<br>
• <b>ἄλλος, -η, -ο</b> — другой<br><br>

grammar: `<b>1. Энклитики и проклитики</b><br>
<b>Энклитики</b> — односложные или двусложные слова, которые теряют ударение и примыкают к предыдущему слову. В греческом языке к энклитикам относятся: μου, μοι, με; σου, σοι, σε; ἐστί(ν), εἰσί(ν); τις, τι; που, ποτε и др.<br><br>
<b>Проклитики</b> — безударные слова, которые образуют единство с последующим словом. К проклитикам относятся: ὁ, ἡ, οἱ, αἱ; εἰς, ἐκ, ἐν; οὐ (οὐκ, οὐχ); ὡς; εἰ.<br><br>
<b>Правила ударения для энклитик:</b><br>
1. Слово перед энклитикой НЕ меняет острое ударение на тупое: ἀδελφός μου (не ἀδελφὸς μου).<br>
2. Если слово имеет острое ударение на третьем от конца слоге или облеченное на предпоследнем, оно получает дополнительное острое ударение на последнем слоге: ἄνθρωπός τις, δῶρόν σου.<br>
3. Если перед энклитикой стоит проклитика или энклитика, она получает острое ударение: ἄνθρωπός μου ἐστίν.<br>
4. Двусложная энклитика сохраняет ударение после слова с острым ударением на втором слоге: λόγος ἐστίν.<br>
5. Энклитика сохраняет ударение, если на ней стоит логическое ударение или с неё начинается предложение.<br><br>

<b>5. Три правила употребления местоимений с артиклем</b><br>
<br>
<b>Правило 1: Артикль перед местоимением (атрибутивная позиция)</b><br>
Когда артикль стоит ПЕРЕД местоимением, оно выступает в роли прилагательного (атрибута).<br>
Например: <i>ὁ ἐμός</i> — «мой» (в значении «мой [человек/предмет]»).<br>
Это означает, что местоимение согласуется с артиклем в роде, числе и падеже.<br><br>

<b>Правило 2: Артикль после местоимения (предикативная позиция)</b><br>
Когда артикль стоит ПОСЛЕ местоимения, оно выступает в роли сказуемого (предикатива).<br>
Например: <i>ἐμός ὁ</i> — «это мой» (в значении «мой — тот, который»).<br>
Это встречается реже, обычно с притяжательными местоимениями.<br><br>

<b>Правило 3: Артикль в начале и в конце (субстантивация местоимения)</b><br>
Когда местоимение стоит между двумя артиклями: <i>ὁ ἐμός ὁ</i> — «тот, который мой» или «мой же».<br>
Например: <i>ὁ ἐμός ὁ</i> — «тот, который мой» (с усилением).<br>
Такая конструкция используется для выделения или противопоставления.<br><br>

function shuffle(a) {
    let c = a.slice();
    for (let i = c.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [c[i], c[j]] = [c[j], c[i]];
    }
    return c;
}

function getLessonData(l) { return LESSONS_DATA[l]; }

function getExercises(l, t) {
    let d = getLessonData(l);
    if (!d) return [];
    return d.exercises[t] || [];
}

function loadStats() {
    try {
        let d = localStorage.getItem('greek_stats');
        if (d) {
            let p = JSON.parse(d);
            stats.totalCorrect = p.totalCorrect || 0;
            stats.totalWrong = p.totalWrong || 0;
            stats.errors = p.errors || {};
        }
    } catch(e) {}
}

function startAllFlashcards() {
    showSection('allFlashcardsSection');
    var container = document.getElementById('allFlashcardContainer');
    var allWords = [];
    for (var l = 3; l <= 10; l++) {
        var data = getLessonData(l);
        if (!data || !data.vocabulary) continue;
        for (var i = 0; i < data.vocabulary.length; i++) {
            var item = data.vocabulary[i];
            allWords.push({
                greek: item.greek,
                article: item.article || '',
                translation: item.translation,
                lesson: l
            });
        }
    }
    if (allWords.length === 0) {
        container.innerHTML = '<p>Нет слов.</p>';
        return;
    }
    var shuffled = shuffle(allWords);
    allFlashcardState = {
        words: shuffled,
        index: 0,
        revealed: false,
        correct: 0,
        total: shuffled.length
    };
    showAllFlashcard();
}

function showAllFlashcard() {
    var s = allFlashcardState;
    var container = document.getElementById('allFlashcardContainer');
    if (s.index >= s.total) {
        var p = Math.round((s.correct / s.total) * 100);
        container.innerHTML = '<div class="feedback ' + (p >= 70 ? 'ok' : 'fail') + '">🏁 Проверка завершена!<br>Знаю: ' + s.correct + ' из ' + s.total + ' (' + p + '%)</div><button class="menu-btn primary" onclick="startAllFlashcards()">🔄 Повторить</button><button class="menu-btn" onclick="goToMain()">🔙 В главное</button>';
        return;
    }
    var w = s.words[s.index];
    var html = '<div style="margin-bottom:8px;font-size:14px;color:#7a5f4b;">Слово ' + (s.index + 1) + ' из ' + s.total + '</div>';
    html += '<div class="flashcard-word">' + (w.article ? w.article + ' ' : '') + w.greek + '</div>';
    if (s.revealed) {
        html += '<div class="flashcard-translation">' + w.translation + '</div><div class="flashcard-buttons"><button class="know" onclick="allFlashcardAnswer(true)">✅ Знаю</button><button class="dontknow" onclick="allFlashcardAnswer(false)">❌ Не знаю</button></div>';
    } else {
        html += '<div class="flashcard-buttons"><button class="show" onclick="allFlashcardReveal()">👁️ Показать перевод</button></div>';
    }
    container.innerHTML = html;
}

function allFlashcardReveal() {
    allFlashcardState.revealed = true;
    showAllFlashcard();
}

function allFlashcardAnswer(know) {
    var s = allFlashcardState;
    if (know) {
        s.correct++;
        stats.totalCorrect++;
    } else {
        stats.totalWrong++;
        var w = s.words[s.index];
        if (!stats.errors['all']) stats.errors['all'] = [];
        stats.errors['all'].push({ word: w.greek, correct: w.translation, your: 'не знал' });
    }
    saveStats();
    s.index++;
    s.revealed = false;
    showAllFlashcard();
}

function generateDeclensionTable(forms, translations) {
    if (!forms) return '';
    let html = '';
    // Для местоимений с мужским/женским/средним родом
    if (forms.masculine || forms.feminine || forms.neuter) {
        let cases = ['nom','gen','dat','acc','voc'];
        let labels = {nom:'Nom.',gen:'Gen.',dat:'Dat.',acc:'Acc.',voc:'Voc.'};
        html += '<table><thead><tr><th>Падеж</th><th>Муж.</th><th>Жен.</th><th>Ср.</th>';
        if (translations) html += '<th>Перевод</th>';
        html += '</tr></thead><tbody>';
        for (let c of cases) {
            let m = (forms.masculine && forms.masculine.singular && forms.masculine.singular[c]) ? forms.masculine.singular[c] : '';
            let f = (forms.feminine && forms.feminine.singular && forms.feminine.singular[c]) ? forms.feminine.singular[c] : '';

                    if (translations) {
                        let trans = '';
                        if (translations.singular && translations.singular[c]) trans = translations.singular[c];
                        else if (translations.plural && translations.plural[c]) trans = translations.plural[c];
                        html += '<td>'+trans+'</td>';
                    }
                    html += '</tr>';
                }
            }
            html += '</tbody></table>';
            return html;
        }
// Для глаголов (лица) — добавляем перевод
if (forms.singular && forms.singular["1"] !== undefined) {

}
        // fallback
        let keys = Object.keys(forms.singular || {});
        if (keys.length) {

// ============================================================
// УПРАЖНЕНИЯ (основные функции)
// ============================================================
function startExercise(type) {
    let questions = getExercises(currentLesson, type);
    if (!questions || questions.length === 0) {
        document.getElementById('exerciseQuestion').innerHTML = '<p>Нет вопросов.</p>';
        return;
    }
    exerciseState = { type: type, questions: shuffle(questions), index: 0, correct: 0, total: questions.length };
    showExercise();
}

function getCaseName(caseKey) {
    let map = {
        // Падежи для существительных
        'gen_sg': 'Genitivus (Род. п.) — кого? чего?',
        'dat_sg': 'Dativus (Дат. п.) — кому? чему?',
        'acc_sg': 'Accusativus (Вин. п.) — кого? что?',
        'nom_pl': 'Nominativus (Им. п.) мн.ч. — кто? что?',
        'gen_pl': 'Genitivus (Род. п.) мн.ч. — кого? чего?',
        'dat_pl': 'Dativus (Дат. п.) мн.ч. — кому? чему?',
        'acc_pl': 'Accusativus (Вин. п.) мн.ч. — кого? что?',
        // Родительный падеж мужского рода
        'gen_sg_m': 'Genitivus (Род. п.) муж.р. — кого? чего?',
        'dat_sg_f': 'Dativus (Дат. п.) жен.р. — кому? чему?',
        'acc_sg_n': 'Accusativus (Вин. п.) ср.р. — кого? что?',
        // Для глаголов (личные формы)
        '1sg': '1-е лицо ед.ч. — я',
        '2sg': '2-е лицо ед.ч. — ты',
        '3sg': '3-е лицо ед.ч. — он/она/оно',
        '1pl': '1-е лицо мн.ч. — мы',
        '2pl': '2-е лицо мн.ч. — вы',
        '3pl': '3-е лицо мн.ч. — они'
    };
    return map[caseKey] || caseKey;
}

function showExercise() {
    let s = exerciseState;
    if (s.index >= s.total) {
        let p = Math.round((s.correct / s.total) * 100);
        document.getElementById('exerciseQuestion').innerHTML =
            '<div class="feedback ' + (p >= 70 ? 'ok' : 'fail') + '">🏁 Упражнение завершено!<br>Правильно: ' + s.correct + ' из ' + s.total + ' (' + p + '%)</div>' +
            '<button class="menu-btn primary" onclick="startExercise(\'' + s.type + '\')">🔄 Ещё раз</button>';
        return;
    }
    let q = s.questions[s.index];
    let container = document.getElementById('exerciseQuestion');
    let html = '<div style="margin-bottom:8px;font-size:14px;color:#7a5f4b;">Урок ' + currentLesson + ', упражнение ' + (s.index + 1) + ' из ' + s.total + '</div>';

    if (s.type === 'declension_fill') {
        let caseName = getCaseName(q.case);
        let wordDisplay = q.word ? q.word + ' (' + q.translation + ')' : '';
        html += '<div class="question">Вставьте форму для <b>' + caseName + '</b> для слова <b>' + wordDisplay + '</b></div><div class="options">';
        let opts = shuffle([q.correct].concat(q.distractors));
        for (let o of opts) html += '<button class="option-btn" onclick="answerOpt(\'' + o + '\',\'' + q.correct + '\')">' + o + '</button>';
        html += '</div>';
} else if (s.type === 'translate_greek_to_russian') {
    let idx = s.index;
    html += '<div class="question">Переведите на русский:</div><div style="font-size:24px;text-align:center;margin:12px 0;">' + q.greek + '</div><div class="input-group"><input type="text" id="transInput" placeholder="Введите перевод..." onkeydown="if(event.key===\'Enter\'){checkExerciseTranslation(' + idx + ');}"><button type="button" onclick="checkExerciseTranslation(' + idx + ')">✅ Проверить</button></div>';
} else if (s.type === 'translate_russian_to_greek') {
        let words = shuffle(q.all_words);
        html += '<div class="question">Переведите на греческий (выберите слова по порядку):</div><div style="font-size:20px;text-align:center;margin:12px 0;">' + q.russian + '</div><div class="build-area" id="buildArea"></div><div class="word-bank" id="wordBank">';
        for (let w of words) html += '<span class="chip" onclick="pickWord(\'' + w + '\')">' + w + '</span>';
        html += '</div><button class="menu-btn primary" onclick="checkTranslationRu()">✅ Готово</button> <button class="menu-btn" onclick="clearChosen()">↩️ Очистить</button>';
        window._trans_ru = q;
        window._chosen = [];
    } else if (s.type === 'case_number') {
        html += '<div class="question">Определите падеж и число для формы: <b>' + q.form + '</b></div><div class="options">';
        let opts = shuffle([q.correct].concat(q.distractors));
        for (let o of opts) html += '<button class="option-btn" onclick="answerOpt(\'' + o + '\',\'' + q.correct + '\')">' + o + '</button>';
        html += '</div>';
    } else if (s.type === 'agreement') {
        html += '<div class="question">Вставьте прилагательное <b>' + q.adjective + '</b> в правильной форме:<br>' + q.article + ' ____ ' + q.noun + '</div><div class="options">';
        let opts = shuffle([q.correct].concat(q.distractors));
        for (let o of opts) html += '<button class="option-btn" onclick="answerOpt(\'' + o + '\',\'' + q.correct + '\')">' + o + '</button>';
        html += '</div>';
    } else if (s.type === 'attribute_vs_predicate') {
        html += '<div class="question">Определите, атрибутив или предикатив:<br><b>' + q.phrase + '</b></div><div class="options">';
        let opts = shuffle([q.correct].concat(q.distractors));
        for (let o of opts) html += '<button class="option-btn" onclick="answerOpt(\'' + o + '\',\'' + q.correct + '\')">' + o + '</button>';
        html += '</div>';
    } else if (s.type === 'substantivation') {
        html += '<div class="question">Что означает:<br><b>' + q.phrase + '</b> ?</div><div class="options">';
        let opts = shuffle([q.correct].concat(q.distractors));
        for (let o of opts) html += '<button class="option-btn" onclick="answerOpt(\'' + o + '\',\'' + q.correct + '\')">' + o + '</button>';
        html += '</div>';
    } else if (s.type === 'article_fill') {
        html += '<div class="question">Вставьте правильную форму артикля:<br>____ ' + q.noun + '</div><div class="options">';
        let opts = shuffle([q.correct_article].concat(q.distractors));
        for (let o of opts) html += '<button class="option-btn" onclick="answerOpt(\'' + o + '\',\'' + q.correct_article + '\')">' + o + '</button>';
        html += '</div>';
    } else {
        html += '<p>Тип упражнения не поддерживается.</p>';
    }
    container.innerHTML = html;
}

function answerOpt(sel, corr) {
    let container = document.getElementById('exerciseQuestion');
    let btns = container.querySelectorAll('.option-btn');
    let ok = sel === corr;
    btns.forEach(b => { b.disabled = true; if (b.textContent === corr) b.classList.add('correct'); if (b.textContent === sel && !ok) b.classList.add('wrong'); });
    if (ok) { stats.totalCorrect++; exerciseState.correct++; } else {
        stats.totalWrong++;
        let lesson = currentLesson;
        if (!stats.errors[lesson]) stats.errors[lesson] = [];
        let q = exerciseState.questions[exerciseState.index];
        stats.errors[lesson].push({ word: q.word || q.greek || 'вопрос', correct: corr, your: sel });
    }
    saveStats();
    exerciseState.index++;
    setTimeout(showExercise, 1200);
}

function checkTranslation() {
    let inp = document.getElementById('transInput');
    if (!inp) return;
    let ans = inp.value.trim().toLowerCase();
    let q = window._trans_q;
    if (!q) return;
    let ok = true;
    for (let kw of q.keywords) {
        if (ans.indexOf(kw.toLowerCase()) === -1) { ok = false; break; }
    }
    let container = document.getElementById('exerciseQuestion');
    if (ok) { stats.totalCorrect++; exerciseState.correct++; container.innerHTML = '<div class="feedback ok">✅ Верно!</div>'; } else {
        stats.totalWrong++;
        let lesson = currentLesson;
        if (!stats.errors[lesson]) stats.errors[lesson] = [];
        stats.errors[lesson].push({ word: q.greek, correct: q.keywords.join(', '), your: ans });
        container.innerHTML = '<div class="feedback fail">❌ Неверно. Ключевые слова: ' + q.keywords.join(', ') + '</div>';
    }
    saveStats();
    exerciseState.index++;
    setTimeout(showExercise, 1500);
}

function pickWord(w) {
    window._chosen.push(w);
    let bank = document.getElementById('wordBank');
    bank.querySelectorAll('.chip').forEach(c => {
        if (c.textContent === w && !c.classList.contains('picked')) c.classList.add('picked');
    });
    let area = document.getElementById('buildArea');
    let t = document.createElement('span');
    t.className = 'token';
    t.textContent = w;
    area.appendChild(t);
}

function clearChosen() {
    window._chosen = [];
    document.getElementById('buildArea').innerHTML = '';
    document.getElementById('wordBank').querySelectorAll('.chip').forEach(c => c.classList.remove('picked'));
}

function checkTranslationRu() {
    let chosen = window._chosen || [];
    let q = window._trans_ru;
    if (!q) return;
    let corr = q.correct_sequence;
    let ok = chosen.length === corr.length && chosen.every((w,i) => w === corr[i]);
    let container = document.getElementById('exerciseQuestion');
    if (ok) { stats.totalCorrect++; exerciseState.correct++; container.innerHTML = '<div class="feedback ok">✅ Верно!</div>'; } else {
        stats.totalWrong++;
        let lesson = currentLesson;
        if (!stats.errors[lesson]) stats.errors[lesson] = [];
        stats.errors[lesson].push({ word: q.russian, correct: corr.join(' '), your: chosen.join(' ') });
        container.innerHTML = '<div class="feedback fail">❌ Неверно. Правильно: ' + corr.join(' ') + '</div>';
    }
    saveStats();
    exerciseState.index++;
    setTimeout(showExercise, 1500);
}

function startFlashcards() {
    let data = getLessonData(currentLesson);
    if (!data || !data.vocabulary || data.vocabulary.length === 0) {
        document.getElementById('flashcardContainer').innerHTML = '<p>Нет слов.</p>';
        return;
    }
    let words = shuffle(data.vocabulary.map(item => {
        return { greek: item.greek, article: item.article || '', translation: item.translation };
    }));
    flashcardState = { words: words, index: 0, revealed: false, correct: 0, total: words.length };
    showFlashcard();
}

function showFlashcard() {
    let s = flashcardState;
    let container = document.getElementById('flashcardContainer');
    if (s.index >= s.total) {
        let p = Math.round((s.correct / s.total) * 100);
        container.innerHTML = '<div style="margin-bottom:8px;font-size:14px;color:#7a5f4b;">Урок ' + currentLesson + '</div><div class="feedback ' + (p >= 70 ? 'ok' : 'fail') + '">🏁 Карточки завершены!<br>Знаю: ' + s.correct + ' из ' + s.total + ' (' + p + '%)</div><button class="menu-btn primary" onclick="startFlashcards()">🔄 Повторить</button>';
        return;
    }
    let w = s.words[s.index];
    let html = '<div style="margin-bottom:8px;font-size:14px;color:#7a5f4b;">Урок ' + currentLesson + ', карточка ' + (s.index + 1) + ' из ' + s.total + '</div>';
    html += '<div class="flashcard-word">' + (w.article ? w.article + ' ' : '') + w.greek + '</div>';
    if (s.revealed) {
        html += '<div class="flashcard-translation">' + w.translation + '</div><div class="flashcard-buttons"><button class="know" onclick="flashAnswer(true)">✅ Знаю</button><button class="dontknow" onclick="flashAnswer(false)">❌ Не знаю</button></div>';
    } else {
        html += '<div class="flashcard-buttons"><button class="show" onclick="flashReveal()">👁️ Показать перевод</button></div>';
    }
    container.innerHTML = html;
}

function flashReveal() { flashcardState.revealed = true; showFlashcard(); }

function flashAnswer(know) {
    let s = flashcardState;
    if (know) { s.correct++; stats.totalCorrect++; } else {
        stats.totalWrong++;
        let lesson = currentLesson;
        let w = s.words[s.index];
        if (!stats.errors[lesson]) stats.errors[lesson] = [];
        stats.errors[lesson].push({ word: w.greek, correct: w.translation, your: 'не знал' });
    }
    saveStats();
    s.index++;
    s.revealed = false;
    showFlashcard();
}

// ТЕСТ
// ============================================================
function startTest() {
    let data = getLessonData(currentLesson);
    if (!data) return;
    let all = [];
    let types = ['declension_fill','translate_greek_to_russian','translate_russian_to_greek','case_number','agreement','attribute_vs_predicate','substantivation','article_fill'];
    for (let t of types) {
        let qs = data.exercises[t] || [];
        for (let q of qs) { q._type = t; all.push(q); }
    }
    if (all.length === 0) { alert('Нет вопросов.'); return; }
    testState = { questions: shuffle(all).slice(0, 10), index: 0, correct: 0, total: 10, answered: false };
    showSection('testSection');
    showTest();
}

function cancelTest() {
    testState = { questions: [], index: 0, correct: 0, total: 0, answered: false };
    showSection('lessonSection');
    switchLessonPart('exercise');
}

function showTest() {
    let s = testState;
    if (s.index >= s.total) {
        let p = Math.round((s.correct / s.total) * 100);
        document.getElementById('testContainer').innerHTML =
            '<div style="margin-bottom:8px;font-size:14px;color:#7a5f4b;">Урок ' + currentLesson + '</div><div class="feedback ' + (p >= 70 ? 'ok' : 'fail') + '">🏁 Тест завершён!<br>Правильно: ' + s.correct + ' из ' + s.total + ' (' + p + '%)</div><button class="menu-btn primary" onclick="startTest()">🔄 Повторить</button><button class="menu-btn" onclick="cancelTest()">🔙 Назад</button>';
        return;
    }
    let q = s.questions[s.index];
    let container = document.getElementById('testContainer');
    let html = '<div style="margin-bottom:8px;font-size:14px;color:#7a5f4b;">Урок ' + currentLesson + ', вопрос ' + (s.index + 1) + ' из ' + s.total + '</div>';
    let t = q._type;

    if (t === 'declension_fill' || t === 'case_number' || t === 'agreement' ||
        t === 'attribute_vs_predicate' || t === 'substantivation' || t === 'article_fill') {
        let text = '';
        if (t === 'declension_fill') {
            let caseName = getCaseName(q.case);
            let wordDisplay = q.word ? q.word + ' (' + q.translation + ')' : '';
            text = 'Вставьте форму для <b>' + caseName + '</b> для слова <b>' + wordDisplay + '</b>';
        } else if (t === 'case_number') {
            text = 'Определите падеж и число: <b>' + q.form + '</b>';
        } else if (t === 'agreement') {
            text = 'Вставьте прилагательное <b>' + q.adjective + '</b>: ' + q.article + ' ____ ' + q.noun;
        } else if (t === 'attribute_vs_predicate') {
            text = 'Атрибутив или предикатив? <b>' + q.phrase + '</b>';
        } else if (t === 'substantivation') {
            text = 'Что означает? <b>' + q.phrase + '</b>';
        } else if (t === 'article_fill') {
            text = 'Вставьте артикль: ____ ' + q.noun;
        }
        let corr = q.correct || q.correct_article;
        let opts = shuffle([corr].concat(q.distractors));
        html += '<div class="question">' + text + '</div><div class="options">';
        for (let o of opts) html += '<button class="option-btn" onclick="testAnswer(\'' + o + '\',\'' + corr + '\')">' + o + '</button>';
        html += '</div>';
    } else if (t === 'translate_greek_to_russian') {
        html += '<div class="question">Переведите: <b>' + q.greek + '</b></div><div class="input-group"><input type="text" id="testTransInput" placeholder="Введите перевод..."><button onclick="testTranslation()">✅ Проверить</button></div>';
        window._test_q = q;
    } else if (t === 'translate_russian_to_greek') {
        let words = shuffle(q.all_words);
        html += '<div class="question">Переведите на греческий (выберите слова по порядку):<br>' + q.russian + '</div>';
        html += '<div class="build-area" id="testBuildArea"></div><div class="word-bank" id="testWordBank">';
        for (let w of words) html += '<span class="chip" onclick="testPickWord(\'' + w + '\')">' + w + '</span>';
        html += '</div><button class="menu-btn primary" onclick="testTranslationRu()">✅ Готово</button> <button class="menu-btn" onclick="testClearChosen()">↩️ Очистить</button>';
        window._test_ru = q;
        window._test_chosen = [];
    } else {
        html += '<p>Неизвестный тип вопроса.</p>';
    }
    container.innerHTML = html;
    s.answered = false;
}

function testAnswer(sel, corr) {
    if (testState.answered) return;
    testState.answered = true;
    let ok = sel === corr;
    if (ok) testState.correct++;
    else {
        stats.totalWrong++;
        let lesson = currentLesson;
        if (!stats.errors[lesson]) stats.errors[lesson] = [];
        let q = testState.questions[testState.index];
        stats.errors[lesson].push({ word: q.word || q.greek || 'вопрос', correct: corr, your: sel });
    }
    stats.totalCorrect += ok ? 1 : 0;
    saveStats();
    let container = document.getElementById('testContainer');
    if (ok) container.innerHTML = '<div class="feedback ok">✅ Верно!</div>';
    else container.innerHTML = '<div class="feedback fail">❌ Неверно. Правильный ответ: <strong>' + corr + '</strong></div>';
    setTimeout(() => { testState.index++; showTest(); }, 1500);
}

function testTranslation() {
    if (testState.answered) return;
    let inp = document.getElementById('testTransInput');
    if (!inp) return;
    let ans = inp.value.trim().toLowerCase();
    let q = window._test_q;
    if (!q) return;
    let ok = true;
    for (let kw of q.keywords) {
        if (ans.indexOf(kw.toLowerCase()) === -1) { ok = false; break; }
    }
    let container = document.getElementById('testContainer');
    if (ok) { testState.correct++; stats.totalCorrect++; container.innerHTML = '<div class="feedback ok">✅ Верно!</div>'; } else {
        stats.totalWrong++;
        let lesson = currentLesson;
        if (!stats.errors[lesson]) stats.errors[lesson] = [];
        stats.errors[lesson].push({ word: q.greek, correct: q.keywords.join(', '), your: ans });
        container.innerHTML = '<div class="feedback fail">❌ Неверно. Ключевые слова: ' + q.keywords.join(', ') + '</div>';
    }
    saveStats();
    testState.answered = true;
    setTimeout(() => { testState.index++; showTest(); }, 1500);
}

function testPickWord(w) {
    if (testState.answered) return;
    window._test_chosen.push(w);
    let bank = document.getElementById('testWordBank');
    bank.querySelectorAll('.chip').forEach(c => {
        if (c.textContent === w && !c.classList.contains('picked')) c.classList.add('picked');
    });
    let area = document.getElementById('testBuildArea');
    let t = document.createElement('span');
    t.className = 'token';
    t.textContent = w;
    area.appendChild(t);
}

function testClearChosen() {
    window._test_chosen = [];
    document.getElementById('testBuildArea').innerHTML = '';
    document.getElementById('testWordBank').querySelectorAll('.chip').forEach(c => c.classList.remove('picked'));
}

function testTranslationRu() {
    if (testState.answered) return;
    let chosen = window._test_chosen || [];
    let q = window._test_ru;
    if (!q) return;
    let corr = q.correct_sequence;
    let ok = chosen.length === corr.length && chosen.every((w,i) => w === corr[i]);
    let container = document.getElementById('testContainer');
    if (ok) { testState.correct++; stats.totalCorrect++; container.innerHTML = '<div class="feedback ok">✅ Верно!</div>'; } else {
        stats.totalWrong++;
        let lesson = currentLesson;
        if (!stats.errors[lesson]) stats.errors[lesson] = [];
        stats.errors[lesson].push({ word: q.russian, correct: corr.join(' '), your: chosen.join(' ') });
        container.innerHTML = '<div class="feedback fail">❌ Неверно. Правильно: ' + corr.join(' ') + '</div>';
    }
    saveStats();
    testState.answered = true;
    setTimeout(() => { testState.index++; showTest(); }, 1500);
}

function showStats() {
    showSection('statsSection');
    document.getElementById('statsContent').innerHTML =

}

function showErrors() {
    showSection('errorsSection');
    let content = document.getElementById('errorsContent');
    let err = stats.errors;
    if (!err || Object.keys(err).length === 0) { content.innerHTML = '<p>🎉 Ошибок нет!</p>'; return; }
    let html = '';
    for (let lesson of Object.keys(err)) {
        let items = err[lesson];
        html += '<div style="margin-bottom:12px;"><strong>Урок ' + lesson + '</strong></div>';
        for (let e of items) {
            html += '<div class="error-item">' + e.word + ' → правильно: <strong>' + e.correct + '</strong>, вы: ' + e.your + '</div>';
        }
    }
    html += '<button class="clear-btn" onclick="clearErrors()">🗑️ Очистить ошибки</button>';
    content.innerHTML = html;
}

function clearErrors() {
    if (confirm('Удалить ошибки?')) {
        stats.errors = {};
        saveStats();
        showErrors();
    }
}

function clearAllProgress() {
    if (confirm('Сбросить всю статистику?')) {
        stats = { totalCorrect: 0, totalWrong: 0, errors: {} };
        saveStats();
        goToMain();
    }
}

function checkTranslationBuild() {
    let s = translationState;
    if (s.index >= s.total) return;
    let q = s.questions[s.index];
    if (!q) return;
    let chosen = s.chosen;
    let correct = q.correct;
    let ok = chosen.length === correct.length && chosen.every((w, i) => w === correct[i]);
    let container = document.getElementById('translationQuestion');
    if (ok) {
        s.correct++;
        stats.totalCorrect++;
        container.innerHTML = '<div class="feedback ok">✅ Верно!</div>';
    } else {
        stats.totalWrong++;
        let lesson = currentLesson;
        if (!stats.errors[lesson]) stats.errors[lesson] = [];
        stats.errors[lesson].push({ word: q.source, correct: correct.join(' '), your: chosen.join(' ') });
        container.innerHTML = '<div class="feedback fail">❌ Неверно. Правильно: <strong>' + correct.join(' ') + '</strong></div>';
    }
    saveStats();
    s.index++;
    setTimeout(showTranslation, 1500);
}
function startTranslation(type) {
    let data = getLessonData(currentLesson);
    if (!data || !data.translation || !data.translation[type]) {
        document.getElementById('translationQuestion').innerHTML = '<p>Нет упражнений.</p>';
        return;
    }
    let qs = data.translation[type].slice();
    translationState = {
        type: type,
        questions: shuffle(qs),
        index: 0,
        correct: 0,
        total: qs.length,
        chosen: []
    };
    showTranslation();
}

function showTranslation() {
    let s = translationState;
    if (s.index >= s.total) {
        let p = Math.round((s.correct / s.total) * 100);
        document.getElementById('translationQuestion').innerHTML =
            '<div class="feedback ' + (p >= 70 ? 'ok' : 'fail') + '">🏁 Упражнение завершено!<br>Правильно: ' + s.correct + ' из ' + s.total + ' (' + p + '%)</div>' +
            '<button class="menu-btn primary" onclick="startTranslation(\'' + s.type + '\')">🔄 Ещё раз</button>';
        return;
    }
    let q = s.questions[s.index];
    let container = document.getElementById('translationQuestion');
    let html = '<div style="margin-bottom:8px;font-size:14px;color:#7a5f4b;">Урок ' + currentLesson + ', перевод ' + (s.index + 1) + ' из ' + s.total + '</div>';
    html += '<div class="question">' + q.source + '</div>';

    // Собираем все слова: правильные + лишние (из словаря урока)
    let lessonData = getLessonData(currentLesson);
    let vocabWords = lessonData.vocabulary ? lessonData.vocabulary.map(v => v.greek) : [];
    let allWords = [];
    if (s.type === 'ru_to_el') {
        let correctWords = q.correct;
        let extras = vocabWords.filter(w => !correctWords.includes(w));
        let chosenExtras = shuffle(extras).slice(0, 4);
        allWords = shuffle([...correctWords, ...chosenExtras]);
    } else {
        let correctWords = q.correct;
        let allTranslations = lessonData.vocabulary ? lessonData.vocabulary.map(v => v.translation) : [];
        let flat = [];
        allTranslations.forEach(t => {
            t.split(/[,;]/).forEach(w => {
                let trimmed = w.trim();
                if (trimmed) flat.push(trimmed);
            });
        });
        let extras = flat.filter(w => !correctWords.includes(w));
        let chosenExtras = shuffle(extras).slice(0, 4);
        allWords = shuffle([...correctWords, ...chosenExtras]);
    }

    html += '<div class="build-area" id="transBuildArea"></div>';
    html += '<div class="word-bank" id="transWordBank">';
    for (let w of allWords) {
        html += '<span class="chip" onclick="transPickWord(\'' + w.replace(/'/g, "\\'") + '\')">' + w + '</span>';
    }
    html += '</div>';
    html += '<button class="menu-btn primary" onclick="checkTranslationBuild()">✅ Проверить</button> ';
    html += '<button class="menu-btn" onclick="transClear()">↩️ Очистить</button>';

    container.innerHTML = html;
    translationState.chosen = [];
}

function transPickWord(w) {
    translationState.chosen.push(w);
    let bank = document.getElementById('transWordBank');
    bank.querySelectorAll('.chip').forEach(c => {
        if (c.textContent === w && !c.classList.contains('picked')) c.classList.add('picked');
    });
    let area = document.getElementById('transBuildArea');
    let t = document.createElement('span');
    t.className = 'token';
    t.textContent = w;
    area.appendChild(t);
}

function transClear() {
    translationState.chosen = [];
    document.getElementById('transBuildArea').innerHTML = '';
    document.getElementById('transWordBank').querySelectorAll('.chip').forEach(c => c.classList.remove('picked'));
}

function goToPrevLesson() {
    let prev = currentLesson - 1;
    if (prev < 1) {  // было prev < 3
        showToast('Это первый урок.');
        return;
    }
    let data = getLessonData(prev);
    if (!data) {
        showToast('Урок ' + prev + ' ещё не добавлен.');
        return;
    }
    openLesson(prev);
    updateNavButtons(prev);
}

function goToNextLesson() {
    let next = currentLesson + 1;
    if (next > 10) {
        showToast('Это последний урок (урок 10).');
        return;
    }
    let data = getLessonData(next);
    if (!data) {
        showToast('Урок ' + next + ' ещё не добавлен.');
        return;
    }
    openLesson(next);
    updateNavButtons(next);
}

function updateNavButtons(lesson) {
    let prevBtn = document.getElementById('prevLessonBtn');
    let nextBtn = document.getElementById('nextLessonBtn');
    
    if (prevBtn) {
        if (lesson <= 1) {  // было <= 3
            prevBtn.style.opacity = '0.5';
            prevBtn.style.cursor = 'not-allowed';
        } else {
            prevBtn.style.opacity = '1';
            prevBtn.style.cursor = 'pointer';
        }
    }
    
    if (nextBtn) {
        if (lesson >= 10) {
            nextBtn.style.opacity = '0.5';
            nextBtn.style.cursor = 'not-allowed';
        } else {
            nextBtn.style.opacity = '1';
            nextBtn.style.cursor = 'pointer';
        }
    }
}

function showToast(message) {
    let existing = document.querySelector('.toast-message');
    if (existing) existing.remove();
    
    let toast = document.createElement('div');
    toast.className = 'toast-message';
    toast.textContent = message;
    Object.assign(toast.style, {
        position: 'fixed',
        bottom: '30px',
        left: '50%',
        transform: 'translateX(-50%)',
        background: '#3d2a1e',
        color: '#fff',
        padding: '12px 24px',
        borderRadius: '12px',
        fontSize: '16px',
        zIndex: '9999',
        boxShadow: '0 4px 20px rgba(0,0,0,0.3)',
        transition: 'opacity 0.3s ease',
        opacity: '1'
    });
    document.body.appendChild(toast);
    
    setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
    }, 2000);
}

let prayerExerciseState = { type: null, questions: [], index: 0, correct: 0, total: 0, chosen: [] };

function showPrayer() {
    showSection('prayerSection');
    renderPrayerText();
    renderPrayerExercise();
}
    
function renderPrayerText() {
    const container = document.getElementById('prayerContent');
    let html = '<div style="margin-bottom:20px;">';
    PRAYER_DATA.verses.forEach((verse, verseIdx) => {
        // Строка с греческими словами (кликабельными)
        html += `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px;padding:6px 0;border-bottom:1px solid #eee;">`;
        verse.words.forEach((word, wordIdx) => {
            html += `<span class="prayer-word" data-verse="${verseIdx}" data-word="${wordIdx}" style="cursor:pointer;background:var(--chip-bg);padding:2px 8px;border-radius:4px;font-size:18px;"transition:0.1s;" onclick="showWordAnalysis(${verseIdx}, ${wordIdx})">${word.greek}</span>`;
        });
        html += `</div>`;
        // Русский перевод
        html += `<div style="margin-left:12px;color:#5f4a38;font-size:15px;margin-bottom:2px;">${verse.russian}</div>`;
        // Транскрипция (эразмово произношение)
        if (verse.transcription) {
            html += `<div style="margin-left:12px;color:#7a5f4b;font-size:14px;font-style:italic;margin-bottom:6px;">${verse.transcription}</div>`;
        }
        // Контейнер для анализа слова (появляется по клику)
        html += `<div id="analysis-${verseIdx}" style="background:#f4eee8;padding:8px 12px;border-radius:8px;margin:6px 0 12px 12px;display:none;border-left:3px solid #b7a48b;"></div>`;
    });
    html += '</div>';
    container.innerHTML = html;
}

function showWordAnalysis(verseIdx, wordIdx) {
    const verse = PRAYER_DATA.verses[verseIdx];
    const word = verse.words[wordIdx];
    const analysisDiv = document.getElementById(`analysis-${verseIdx}`);
    if (!analysisDiv) return;

    // Закрываем все другие окна анализа
    document.querySelectorAll('[id^="analysis-"]').forEach(el => {
        if (el.id !== `analysis-${verseIdx}`) {
            el.style.display = 'none';
        }
    });

    // Показываем и заполняем (без кнопки!)
    analysisDiv.style.display = 'block';
    analysisDiv.innerHTML = `
        <strong>${word.greek}</strong> — ${word.translation}<br>
        <span style="font-size:14px;color:#4a3728;">${word.analysis}</span>
    `;
}

function renderPrayerExercise() {
    const container = document.getElementById('prayerExercise');
    let html = `<h4 style="margin:12px 0;">📝 Упражнения</h4>`;
    html += `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;">
        <button class="menu-btn" onclick="startPrayerFill()">🔤 Заполни пропуски</button>
        <button class="menu-btn primary" onclick="startPrayerTranslate()">🌍 Перевод на греческий</button>
    </div>`;
    html += `<div id="prayerExerciseQuestion"></div>`;
    container.innerHTML = html;
}
    
function closeAllAnalysis() {
    document.querySelectorAll('[id^="analysis-"]').forEach(el => {
        el.style.display = 'none';
    });
}
    
function startPrayerFill() {
    let questions = [];
    PRAYER_DATA.verses.forEach(verse => {
        const wordIndex = Math.floor(Math.random() * verse.words.length);
        const correctWord = verse.words[wordIndex].greek;
        const allWords = PRAYER_DATA.verses.flatMap(v => v.words.map(w => w.greek));
        const distractors = shuffle(allWords.filter(w => w !== correctWord)).slice(0, 3);
        questions.push({
            verse: verse.greek,
            correct: correctWord,
            distractors: distractors,
            blankIndex: wordIndex,
            russian: verse.russian
        });
    });
    prayerExerciseState = { type: 'fill', questions: shuffle(questions), index: 0, correct: 0, total: questions.length };
    showPrayerExerciseQuestion();
}

function startPrayerTranslate() {
    let questions = [];
    PRAYER_DATA.verses.forEach(verse => {
        const correctWords = verse.words.map(w => w.greek);
        const allWords = PRAYER_DATA.verses.flatMap(v => v.words.map(w => w.greek));
        const extras = shuffle(allWords.filter(w => !correctWords.includes(w))).slice(0, 3);
        const pool = shuffle([...correctWords, ...extras]);
        questions.push({
            russian: verse.russian,
            correct: correctWords,
            pool: pool
        });
    });
    prayerExerciseState = { type: 'translate', questions: shuffle(questions), index: 0, correct: 0, total: questions.length, chosen: [] };
    showPrayerExerciseQuestion();
}

function showPrayerExerciseQuestion() {
    const state = prayerExerciseState;
    const container = document.getElementById('prayerExerciseQuestion');
    if (state.index >= state.total) {
        let p = Math.round((state.correct / state.total) * 100);
        container.innerHTML = `<div class="feedback ${p>=70?'ok':'fail'}">🏁 Упражнение завершено!<br>Правильно: ${state.correct} из ${state.total} (${p}%)</div>
            <button class="menu-btn primary" onclick="startPrayer${state.type==='fill'?'Fill':'Translate'}()">🔄 Ещё раз</button>`;
        return;
    }
    const q = state.questions[state.index];
    if (state.type === 'fill') {
        const words = q.verse.split(' ');
        const displayWords = words.map((w, i) => {
            if (i === q.blankIndex) return '___';
            return w;
        });
        const text = displayWords.join(' ');
        let html = `<div style="margin-bottom:8px;font-size:14px;color:#7a5f4b;">Вопрос ${state.index+1} из ${state.total}</div>`;
        html += `<div style="font-size:18px;margin-bottom:8px;">${text}</div>`;
        html += `<div style="font-size:15px;color:#5f4a38;margin-bottom:12px;">${q.russian}</div>`;
        html += `<div class="options">`;
        const opts = shuffle([q.correct, ...q.distractors]);
        opts.forEach(opt => {
            html += `<button class="option-btn" onclick="prayerFillAnswer('${opt}', '${q.correct}')">${opt}</button>`;
        });
        html += `</div>`;
        container.innerHTML = html;
    } else if (state.type === 'translate') {
        let html = `<div style="margin-bottom:8px;font-size:14px;color:#7a5f4b;">Вопрос ${state.index+1} из ${state.total}</div>`;
        html += `<div style="font-size:18px;margin-bottom:8px;">${q.russian}</div>`;
        html += `<div style="font-size:15px;color:#5f4a38;margin-bottom:12px;">Соберите греческий перевод из слов:</div>`;
        html += `<div class="build-area" id="prayerBuildArea"></div>`;
        html += `<div class="word-bank" id="prayerWordBank">`;
        q.pool.forEach(w => {
            html += `<span class="chip" onclick="prayerPickWord('${w}')">${w}</span>`;
        });
        html += `</div>`;
        html += `<button class="menu-btn primary" onclick="prayerCheckTranslate()">✅ Проверить</button>`;
        html += `<button class="menu-btn" onclick="prayerClearTranslate()">↩️ Очистить</button>`;
        container.innerHTML = html;
        prayerExerciseState.chosen = [];
    }
}

function prayerFillAnswer(selected, correct) {
    const state = prayerExerciseState;
    const container = document.getElementById('prayerExerciseQuestion');
    const btns = container.querySelectorAll('.option-btn');
    btns.forEach(b => {
        b.disabled = true;
        if (b.textContent === correct) b.classList.add('correct');
        if (b.textContent === selected && selected !== correct) b.classList.add('wrong');
    });
    if (selected === correct) {
        state.correct++;
        stats.totalCorrect++;
    } else {
        stats.totalWrong++;
    }
    saveStats();
    state.index++;
    setTimeout(showPrayerExerciseQuestion, 1200);
}

function prayerPickWord(w) {
    prayerExerciseState.chosen.push(w);
    let bank = document.getElementById('prayerWordBank');
    bank.querySelectorAll('.chip').forEach(c => {
        if (c.textContent === w && !c.classList.contains('picked')) c.classList.add('picked');
    });
    let area = document.getElementById('prayerBuildArea');
    let t = document.createElement('span');
    t.className = 'token';
    t.textContent = w;
    area.appendChild(t);
}

function prayerClearTranslate() {
    prayerExerciseState.chosen = [];
    document.getElementById('prayerBuildArea').innerHTML = '';
    document.getElementById('prayerWordBank').querySelectorAll('.chip').forEach(c => c.classList.remove('picked'));
}

function prayerCheckTranslate() {
    const state = prayerExerciseState;
    const q = state.questions[state.index];
    const chosen = state.chosen;
    const correct = q.correct;
    const ok = chosen.length === correct.length && chosen.every((w, i) => w === correct[i]);
    const container = document.getElementById('prayerExerciseQuestion');
    if (ok) {
        state.correct++;
        stats.totalCorrect++;
        container.innerHTML = '<div class="feedback ok">✅ Верно!</div>';
    } else {
        stats.totalWrong++;
        container.innerHTML = `<div class="feedback fail">❌ Неверно. Правильный порядок: <strong>${correct.join(' ')}</strong></div>`;
    }
    saveStats();
    state.index++;
    setTimeout(showPrayerExerciseQuestion, 1500);
}

function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    let btn = document.getElementById('themeToggleBtn');
    if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
    try { localStorage.setItem('greek_theme', theme); } catch(e) {}
}

function toggleTheme() {
    let current = document.documentElement.getAttribute('data-theme') || 'light';
    applyTheme(current === 'dark' ? 'light' : 'dark');
}

function initTheme() {
    let saved = null;
    try { saved = localStorage.getItem('greek_theme'); } catch(e) {}
    if (!saved) {
        saved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    applyTheme(saved);
}

let allVocabCache = null;

function buildAllVocabCache() {
    let entries = [];
    let seen = new Set();
    for (let l = 3; l <= 10; l++) {
        let data = getLessonData(l);
        if (!data || !data.vocabulary) continue;
        data.vocabulary.forEach(item => {
            let key = item.greek + '|' + (item.article || '');
            if (seen.has(key)) return;
            seen.add(key);
            entries.push({
                greek: item.greek,
                article: item.article || '',
                translation: item.translation,
                type: item.type || 'other',
                lesson: l
            });
        });
    }
    entries.sort((a, b) => a.greek.localeCompare(b.greek));
    return entries;
}

const TYPE_LABELS = {
    noun: '📌 Существительные',
    verb: '📌 Глаголы',
    adjective: '📌 Прилагательные',
    preposition: '📌 Предлоги',
    pronoun: '📌 Местоимения',
    adverb: '📌 Наречия',
    conjunction: '📌 Союзы',
    other: '📌 Прочее'
};

function renderVocabEntries(entries) {
    let container = document.getElementById('allVocabContent');
    if (!container) return;
    if (entries.length === 0) {
        container.innerHTML = '<div class="search-empty">Ничего не найдено 🤷</div>';
        return;
    }
    let byType = {};
    entries.forEach(e => {
        if (!byType[e.type]) byType[e.type] = [];
        byType[e.type].push(e);
    });
    let order = ['noun','verb','adjective','preposition','pronoun','adverb','conjunction','other'];
    let html = '';
    order.forEach(type => {
        if (!byType[type] || byType[type].length === 0) return;
        html += '<div class="vocab-section"><h4>' + (TYPE_LABELS[type] || type) + '</h4>';
        byType[type].forEach(e => {
            let art = e.article ? e.article + ' ' : '';
            html += '<div class="word-item"><div class="word-row"><strong>' + art + e.greek + '</strong><span>' + e.translation + '</span></div></div>';
        });
        html += '</div>';
    });
    container.innerHTML = html || '<div class="search-empty">Ничего не найдено 🤷</div>';
}
function showAllVocab() {
    showSection('allVocabSection');
    allVocabCache = buildAllVocabCache();
    let input = document.getElementById('vocabSearchInput');
    if (input) input.value = '';
    let clearBtn = document.getElementById('vocabSearchClear');
    if (clearBtn) clearBtn.classList.remove('show');
    renderVocabEntries(allVocabCache);
}
function filterAllVocab() {
    let input = document.getElementById('vocabSearchInput');
    let clearBtn = document.getElementById('vocabSearchClear');
    if (!input) return;
    let query = input.value.trim().toLowerCase();
    if (clearBtn) clearBtn.classList.toggle('show', query.length > 0);
    if (!allVocabCache) allVocabCache = buildAllVocabCache();
    if (!query) {
        renderVocabEntries(allVocabCache);
        return;
    }
    let filtered = allVocabCache.filter(e => {
        let greekMatch = e.greek.toLowerCase().includes(query);
        let ruMatch = e.translation.toLowerCase().includes(query);
        return greekMatch || ruMatch;
    });
    renderVocabEntries(filtered);
}

function clearVocabSearch() {
    let input = document.getElementById('vocabSearchInput');
    if (input) input.value = '';
    let clearBtn = document.getElementById('vocabSearchClear');
    if (clearBtn) clearBtn.classList.remove('show');
    renderVocabEntries(allVocabCache || buildAllVocabCache());
}
    function normalizeTranslationData() {
    for (let key in LESSONS_DATA) {
        let lesson = LESSONS_DATA[key];
        if (!lesson.translation) continue;
        ['ru_to_el', 'el_to_ru'].forEach(dir => {
            if (!lesson.translation[dir]) return;
            lesson.translation[dir].forEach(q => {
                if (typeof q.correct === 'string') {
                    q.correct = q.correct
                        .replace(/[.,;:!?]+$/, '')
                        .split(/\s+/)
                        .filter(Boolean);
                }
            });
        });
    }
}
normalizeTranslationData();
initTheme();
loadStats();
renderMainMenu();
    
</script>

    // Принудительно обновляем меню через секунду после загрузки
    setTimeout(function() {
        renderMainMenu();
    }, 500);
</script>
